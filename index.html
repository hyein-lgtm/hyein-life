<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="color-scheme" content="light dark">
<script>try{if(localStorage.getItem("hyein_theme")==="dark"){document.documentElement.setAttribute("data-theme","dark");var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content","#0a1224");}}catch(e){}</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Life OS">
<meta name="description" content="프로젝트·업무·독서·운동·브랜드·부동산을 한 곳에서 관리하는 개인 대시보드">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="manifest">
<link rel="icon">
<link rel="apple-touch-icon">
<title>My Life OS — hyein</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#eef3fb; --card:#ffffff; --ink:#0f1b33; --muted:#5c6c88; --line:#e6ecf7;
  --blue:#2563eb; --blue-d:#1d4ed8; --blue-l:#dbe8ff; --blue-xl:#f4f8ff;
  --navy:#0d1f42; --ok:#0ea472; --warn:#d97706; --danger:#e11d48;
  --r:16px; --sh:0 1px 2px rgba(15,27,51,.05), 0 8px 24px rgba(15,27,51,.05);
  --pink:#d81b60; --pink-s:#e8467f; --pink-l:#ffd3e3; --pink-xl:#fff4f8;
}
*{box-sizing:border-box}
body{
  margin:0;padding:28px 18px 48px;color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:14px;line-height:1.55;letter-spacing:-.01em;
  background:
    radial-gradient(900px 420px at 12% -8%, #dbe8ff 0%, transparent 60%),
    radial-gradient(700px 380px at 92% 0%, #e4f0ff 0%, transparent 55%),
    var(--bg);
  min-height:100vh;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;color:var(--ink)}
a{color:var(--blue)}
.app{max-width:1140px;margin:0 auto;background:var(--card);border-radius:22px;
  box-shadow:0 2px 4px rgba(13,31,66,.04),0 24px 60px rgba(13,31,66,.10);overflow:hidden}
/* topbar */
.topbar{display:flex;align-items:center;gap:14px;padding:18px 24px;
  background:linear-gradient(120deg,var(--navy) 0%,#173a77 45%,#2563eb 100%);color:#fff}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.16);font-size:17px}
.brand h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em}
.brand p{margin:1px 0 0;font-size:11.5px;opacity:.72}
.topmeta{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;
  background:rgba(255,255,255,.12);padding:7px 14px;border-radius:999px}
.topmeta .dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.55)}
/* hero */
.hero{padding:26px 24px 4px}
.hero h2{margin:0 0 6px;font-size:24px;font-weight:800;letter-spacing:-.03em}
.hero p{margin:0;color:var(--muted);font-size:13px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;padding:18px 24px 4px}
.stat{background:var(--blue-xl);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
  font-size:11.5px;color:var(--muted);font-weight:600}
.stat b{display:block;font-size:23px;font-weight:800;color:var(--ink);letter-spacing:-.03em;margin-top:2px}
/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:7px;padding:20px 24px 0}
.tab{border:1px solid var(--line);background:#fff;color:#5a6c8c;border-radius:999px;
  padding:9px 15px;font-size:13px;font-weight:600;transition:.15s}
.tab:hover{border-color:#bed3f7;color:var(--blue)}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.26)}
/* 데일리 투두 탭 강조 */
.tab[data-k="daily"]{background:linear-gradient(135deg,#ffeef5,#ffe1ee);border-color:#ffc2d8;color:#d4477e;font-weight:800}
.tab[data-k="daily"]:hover{border-color:#ff9ec1;color:#c93a70;background:linear-gradient(135deg,#ffe6f0,#ffd6e8)}
.tab[data-k="daily"].on{background:linear-gradient(135deg,#ff7fae,#f6538d);border-color:#f6538d;color:#fff;
  box-shadow:0 6px 18px rgba(246,83,141,.32)}
.tab[data-k="daily"]::after{content:"";width:5px;height:5px;border-radius:50%;background:#f6538d;
  display:inline-block;margin-left:5px;vertical-align:middle}
.tab[data-k="daily"].on::after{background:#fff}
/* board */
.board{padding:18px 24px 28px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.btn{border:1px solid var(--line);background:#fff;color:#41546f;border-radius:11px;
  padding:9px 14px;font-size:13px;font-weight:600;transition:.15s}
.btn:hover{border-color:#bed3f7;background:var(--blue-xl);color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 18px rgba(37,99,235,.28)}
.btn.primary:hover{background:var(--blue-d);color:#fff}
.btn.danger{color:var(--danger);border-color:#fadbe4}
.btn.danger:hover{background:#fff5f7;border-color:#f5c2d0;color:var(--danger)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}
.spacer{flex:1}
.search{border:1px solid var(--line);border-radius:11px;padding:9px 13px;font-size:13px;width:210px;
  background:#fff;outline:none;transition:.15s}
.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:#fff;color:#69799a;border-radius:999px;
  padding:5px 12px;font-size:12px;font-weight:600;transition:.15s}
.chip:hover{border-color:#bed3f7;color:var(--blue)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
/* 완독 = 핑크 */
.chip.tdone{border-color:var(--pink-l);color:var(--pink);background:var(--pink-xl)}
.chip.tdone:hover{border-color:var(--pink-s);color:var(--pink)}
.chip.on.tdone{background:var(--pink);border-color:var(--pink);color:#fff}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
.grid.cal{grid-template-columns:repeat(auto-fill,minmax(304px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  display:flex;flex-direction:column;overflow:hidden;transition:.18s}
.card:hover{border-color:#c9dcfa;box-shadow:0 4px 10px rgba(15,27,51,.06),0 16px 34px rgba(15,27,51,.10);transform:translateY(-2px)}
.card .head{display:flex;align-items:center;gap:8px;padding:13px 15px 0;font-size:11.5px;font-weight:700;color:var(--blue)}
.card .head .t{background:var(--blue-l);padding:3px 9px;border-radius:999px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.card .head .t.tdone{background:var(--pink-l);color:var(--pink)}
.card.tdone{border-color:var(--pink-l)}
.card .head .acts{margin-left:auto;display:flex;gap:4px;opacity:1;transition:.15s;flex-wrap:wrap;justify-content:flex-end}
.card .head .acts button,.card .head .acts a.lnk{display:inline-flex;align-items:center;gap:3px;
  height:24px;width:auto;padding:0 8px;border-radius:8px;border:1px solid var(--line);
  background:#fff;color:#5a6c8c;font-size:11px;line-height:1;white-space:nowrap;cursor:pointer}
.card .head .acts button b,.card .head .acts a.lnk b{font-size:10.5px;font-weight:700;letter-spacing:-.02em}
.card .head .acts button:hover,.card .head .acts a.lnk:hover{border-color:#bed3f7;color:var(--blue);background:var(--blue-xl)}
.card .head .acts button.dl:hover{border-color:#f6c2ce;color:var(--danger);background:#fff5f7}
@media(max-width:400px){.card .head .acts button b,.card .head .acts a.lnk b{display:none}
  .card .head .acts button,.card .head .acts a.lnk{padding:0 7px}}
/* 줄 단위 수정 버튼 */
.x.ed{color:#7e8ca6}
.x.ed:hover{color:var(--blue)}
input.rowin{flex:1;width:100%;font-size:13.5px;padding:5px 9px;border:1.5px solid var(--blue);
  border-radius:9px;background:#fff;outline:none;color:var(--ink);font-family:inherit}
html[data-theme=dark] input.rowin{background:#1e2124;color:#e7edf8}
/* 되돌리기 토스트 */
#toast.hasu{display:flex;align-items:center;gap:12px}
#toast .tundo{flex:none;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.14);
  color:#fff;font-size:12px;font-weight:800;border-radius:999px;padding:5px 12px;cursor:pointer;
  font-family:inherit;letter-spacing:-.01em}
#toast .tundo:hover{background:rgba(255,255,255,.28)}
.card .body{padding:10px 15px 15px;display:flex;flex-direction:column;gap:10px;flex:1}
.card h3{margin:0;font-size:15.5px;font-weight:700;letter-spacing:-.02em;line-height:1.4}
.card h3.clickable{cursor:pointer;transition:.15s}
.card h3.clickable:hover{color:var(--blue)}
.meta{display:flex;flex-wrap:wrap;gap:5px;font-size:11px}
.pill{background:#f2f6fc;color:#5b6d8c;border-radius:999px;padding:3px 9px;font-weight:600}
.pill.st-todo{background:#eef2f8;color:#54637e}
.pill.st-doing{background:var(--blue-l);color:var(--blue-d)}
.pill.st-done{background:#d8f5ea;color:var(--ok)}
.pill.st-hold{background:#fdeccd;color:var(--warn)}
.note{font-size:12.5px;color:var(--muted);line-height:1.65;white-space:pre-wrap}
.bar{height:20px;border-radius:999px;background:#eef2f9;position:relative;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#60a5fa,#2563eb);transition:width .25s}
.bar>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;
  padding-right:10px;font-size:10.5px;font-weight:700}
.bar>span{color:#41546f}
.card a.link{font-size:12px;font-weight:600}
/* calendar */
.monthnav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.monthnav .m{font-size:15px;font-weight:800;letter-spacing:-.02em;min-width:96px;text-align:center}
.cal-wrap{background:var(--blue-xl);border:1px solid var(--line);border-radius:13px;padding:9px}
.cal-head,.cal-body{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-head div{text-align:center;font-size:10px;font-weight:700;color:#6f80a0;padding:2px 0 4px}
.cal-head div.sat{color:#4f7ddb}.cal-head div.sun{color:#e0648a}
.cal-body button{height:29px;border:none;border-radius:9px;background:#fff;color:#a3b2ca;
  font-size:11px;font-weight:600;padding:0;display:flex;align-items:center;justify-content:center;transition:.13s}
.cal-body button:hover{background:var(--blue-l);color:var(--blue-d)}
.cal-body button.on{background:var(--blue);color:#fff;box-shadow:0 3px 8px rgba(37,99,235,.3)}
.cal-body button.today{box-shadow:inset 0 0 0 2px var(--blue);color:var(--blue)}
.cal-body button.on.today{box-shadow:inset 0 0 0 2px #fff,0 3px 8px rgba(37,99,235,.35);color:#fff}
.cal-body button:disabled{background:transparent;cursor:default}
.legend{font-size:11.5px;color:#6f80a0;text-align:center;margin-top:14px}
/* --- 운동 통합 캘린더 --- */
.calbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.cal-body.big{gap:6px}
.dcell{min-height:78px;border:1px solid var(--line);border-radius:12px;background:#fbfcff;
  padding:6px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.dcell:hover{background:var(--blue-xl);border-color:var(--blue-l);transform:translateY(-1px)}
.dcell.off{background:transparent;border-color:transparent;cursor:default}
.dcell.off:hover{transform:none;background:transparent}
.dcell.has{background:#fff;border-color:var(--blue-l)}
.dcell.today{box-shadow:inset 0 0 0 2px var(--blue)}
.dnum{font-size:11.5px;font-weight:800;color:#6f80a0}
.dcell.has .dnum{color:var(--blue-d)}
.dtags{display:flex;flex-direction:column;gap:3px}
.dtag{font-size:9.5px;font-weight:700;padding:2px 5px;border-radius:6px;border:1px solid;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.dmore{font-size:9.5px;color:#6f80a0;font-weight:700;padding-left:3px}
.tsums{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tsum{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#41546f;
  background:var(--blue-xl);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
.tsum i,.chip.tchip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip.tchip{display:inline-flex;align-items:center;gap:6px}
/* --- 날짜 기록 모달 / 종류 관리 --- */
.elist{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.erow{display:flex;align-items:center;gap:9px;background:var(--blue-xl);border:1px solid var(--line);
  border-radius:11px;padding:9px 11px;font-size:13px}
.erow b{font-weight:700;color:var(--ink)}
.erow .dot{width:9px;height:9px;border-radius:50%;flex:none}
.erow .emin{margin-left:auto;color:var(--muted);font-size:12px;font-weight:600}
.erow .tcol{width:34px;height:26px;padding:0;border:1px solid var(--line);border-radius:7px;background:#fff;flex:none}
.erow .tname{flex:1;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit;font-size:13px;background:#fff}
.erow .x{margin-left:auto;border:none;background:transparent;color:#8290a8;cursor:pointer;font-size:13px;flex:none}
.erow .tname+.x{margin-left:0}
.erow .x:hover{color:var(--danger)}
.ehint{font-size:12.5px;color:var(--muted);text-align:center;padding:16px 0;
  background:var(--blue-xl);border:1px dashed var(--line);border-radius:11px}
.btn.wide{width:100%;justify-content:center;margin-top:4px}
textarea.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;min-height:96px;
  line-height:1.5;word-break:break-all;color:#5b6d8c}
/* --- 문장 수집 --- */
.qrow{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
.qpage{flex:none;font-size:11px;font-weight:800;color:var(--blue-d);background:var(--blue-l);
  border-radius:6px;padding:3px 7px;margin-top:1px}
.qtext{flex:1;font-size:13px;line-height:1.65;color:var(--ink)}
.qrow .x{border:none;background:transparent;color:#8290a8;cursor:pointer}
.qrow .x:hover{color:var(--danger)}
.addline input.pg{flex:none;width:64px}
@media(max-width:640px){.dcell{min-height:60px}.dtag{font-size:9.5px}}

.empty{padding:56px 12px;text-align:center;color:#6f80a0;font-size:13px;line-height:1.9;
  border:1px dashed var(--line);border-radius:var(--r)}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(9,20,42,.42);backdrop-filter:blur(5px);
  display:none;align-items:flex-start;justify-content:center;padding:36px 16px;z-index:50;overflow:auto}
.overlay.on{display:flex}
.modal{width:100%;max-width:460px;background:#fff;border-radius:20px;overflow:hidden;
  box-shadow:0 30px 70px rgba(9,20,42,.32);animation:pop .18s ease-out}
.modal.wide{max-width:760px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.mhead{display:flex;align-items:center;gap:10px;padding:17px 20px;border-bottom:1px solid var(--line)}
.mhead .ic{width:32px;height:32px;border-radius:10px;background:var(--blue-l);color:var(--blue-d);
  display:flex;align-items:center;justify-content:center;font-size:15px}
.mhead b{font-size:15px;font-weight:800;letter-spacing:-.02em}
.mhead .close{margin-left:auto;width:32px;height:32px;border-radius:10px;border:1px solid var(--line);
  background:#fff;color:#8394b3;font-size:14px;line-height:1}
.mhead .close:hover{background:#fff5f7;border-color:#f5c2d0;color:var(--danger)}
.crumb{padding:11px 20px;background:var(--blue-xl);border-bottom:1px solid var(--line);
  font-size:11.5px;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.form{padding:18px 20px;display:flex;flex-direction:column;gap:13px;max-height:70vh;overflow:auto}
.foot{display:flex;gap:8px;align-items:center;padding:14px 20px;border-top:1px solid var(--line);background:#fbfdff}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{font-size:13.5px;padding:10px 12px;border:1px solid var(--line);
  border-radius:11px;background:#fff;outline:none;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
.field textarea{min-height:76px;resize:vertical;line-height:1.6}
mark.hl{background:linear-gradient(transparent 42%,#ffe97a 42%);color:inherit;
  padding:0 1px;border-radius:2px;font-weight:700}
html[data-theme=dark] mark.hl{background:linear-gradient(transparent 42%,#8a7318 42%);color:#f3f6fb}
.hlbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:7px}
.hlb{background:#fff7d1;border-color:#f0dd8a}
.hlhint{font-size:10.5px;color:var(--muted);line-height:1.5}
.hlwrap{position:relative;border-radius:11px}
.hlwrap>textarea{background:transparent!important;position:relative;z-index:1;display:block;width:100%;
  box-sizing:border-box;margin:0;resize:none;overflow-y:hidden}
.hlback{position:absolute;left:0;top:0;width:100%;height:100%;z-index:0;margin:0;
  pointer-events:none;overflow:hidden;box-sizing:border-box;border:1px solid transparent;border-radius:11px;
  background:#fff;color:transparent;white-space:pre-wrap;overflow-wrap:break-word;word-break:break-word}
.hlback mark.hl{font-weight:inherit;padding:0;border-radius:2px;color:transparent}
.hlwrap.big>.hlback{background:#fcfdff}
.hlwrap.big:focus-within>.hlback{background:#fff}
html[data-theme=dark] .hlback{background:#1e2124}
html[data-theme=dark] .hlwrap.big>.hlback{background:#1a2230}
.hlcp{font:inherit;letter-spacing:inherit}
#hlpop{position:fixed;z-index:9998;display:none}
#hlpop .hlpopb{font-size:12.5px;font-weight:800;padding:8px 13px;border-radius:999px;
  border:1px solid #e6cf6e;background:#fff4c2;color:#5a4a0e;cursor:pointer;white-space:nowrap;
  line-height:1.15;box-shadow:0 7px 20px rgba(20,30,60,.2);
  -webkit-tap-highlight-color:transparent;animation:hlpopin .11s ease-out}
#hlpop .hlpopb:active{transform:translateY(1px)}
@keyframes hlpopin{from{opacity:0;transform:translateY(3px) scale(.96)}to{opacity:1;transform:none}}
html[data-theme=dark] #hlpop .hlpopb{background:#4b3f12;border-color:#7d6c22;color:#ffe9a3;
  box-shadow:0 7px 20px rgba(0,0,0,.45)}
/* ---- 메모 첨부 사진 ---- */
.npwrap{margin-top:9px;display:grid;gap:8px}
.npbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.npgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px}
.npc{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);
  background:#f6f8fc;aspect-ratio:1/1}
.npc>img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.npx{position:absolute;top:3px;right:3px;width:21px;height:21px;border-radius:50%;border:none;padding:0;
  background:rgba(12,18,32,.6);color:#fff;font-size:11px;line-height:21px;cursor:pointer}
.npx:hover{background:rgba(196,42,54,.92)}
html[data-theme=dark] .npc{background:#18202c}
#nplb{position:fixed;left:0;top:0;right:0;bottom:0;z-index:9999;display:none}
#nplb.on{display:block}
#nplb .nplbbg{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(8,12,22,.9)}
#nplb .nplbi{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);
  max-width:94vw;max-height:76vh;border-radius:12px;background:#fff;box-shadow:0 18px 50px rgba(0,0,0,.55)}

.rroad.good .rfill{background:linear-gradient(90deg,#5fd6a6,#1a9c66)}
.rroad.warn .rfill{background:linear-gradient(90deg,#f6cf87,#e2a03f)}
.rroad.bad .rfill{background:linear-gradient(90deg,#f6adad,#e05b5b)}
.rpace{position:absolute;top:-38px;bottom:-7px;width:0;transform:translateX(-50%);z-index:1}
.rpace i{position:absolute;top:36px;bottom:0;left:-1px;width:2px;border-radius:2px;
  background:repeating-linear-gradient(180deg,rgba(15,27,51,.42) 0 3px,transparent 3px 6px)}
.rpace em{position:absolute;top:0;left:50%;transform:translateX(-50%);white-space:nowrap;font-style:normal;
  font-size:9.5px;font-weight:800;color:var(--muted);background:rgba(255,255,255,.94);
  border:1px solid var(--line);border-radius:99px;padding:1px 6px}
.rrun{position:absolute;top:-17px;transform:translateX(-50%);font-size:21px;line-height:1;z-index:3;
  transition:left .55s cubic-bezier(.34,1.3,.5,1);filter:drop-shadow(0 2px 3px rgba(15,27,51,.2));
  animation:rbob 1.7s ease-in-out infinite}
@keyframes rbob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-3px)}}
.rflag{position:absolute;right:-6px;top:-16px;font-size:18px;line-height:1;opacity:.9;z-index:2}
.rmsg{display:flex;align-items:flex-start;gap:9px;margin-top:18px;background:var(--blue-xl);
  border:1px solid var(--line);border-radius:13px;padding:10px 12px}
.rmsg .re{font-size:19px;line-height:1.2;flex:none}
.rmsg p{margin:0;font-size:12.5px;font-weight:800;color:var(--ink);letter-spacing:-.025em;
  line-height:1.55;word-break:keep-all}
.rmsg p b{color:#2f62c8}
.rmsg p span{display:block;margin-top:2px;font-size:11px;font-weight:700;color:var(--muted)}
.rmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.rchip{font-size:10.5px;font-weight:800;color:var(--muted);background:rgba(15,27,51,.055);
  border-radius:99px;padding:3px 9px}
.rchip b{color:var(--ink)}
.rchip.hi{background:rgba(91,134,229,.13);color:#2f62c8}
.rchip.hi b{color:#2f62c8}
/* ---- 분기 코스 ---- */
.qroute{display:grid;grid-template-columns:repeat(4,1fr);padding:17px 15px 4px}
.qstop{position:relative;padding:0 4px;cursor:pointer}
.qstop:before{content:"";position:absolute;top:9px;left:0;right:0;height:3px;background:#e5eaf3;z-index:0}
.qstop:first-child:before{left:50%}
.qstop:last-child:before{right:50%}
.qstop.past:before,.qstop.now:before{background:#a9c6f7}
.qdot{position:relative;z-index:1;width:21px;height:21px;margin:0 auto 6px;border-radius:50%;
  background:var(--card);border:3px solid #dde4ef;display:flex;align-items:center;justify-content:center;
  font-size:9.5px;font-weight:900;color:var(--muted);line-height:1}
.qstop.past .qdot{border-color:#a9c6f7;background:#a9c6f7;color:#fff}
.qstop.now .qdot{border-color:#5b86e5;background:#5b86e5;color:#fff;box-shadow:0 0 0 4px rgba(91,134,229,.17)}
.qstop.fin .qdot{border-color:#f0c14b;background:var(--card);font-size:11px}
.qstop:hover .qdot{border-color:#5b86e5}
.qnm{text-align:center;font-size:10.5px;font-weight:900;color:var(--muted);line-height:1.3;margin-bottom:4px}
.qnm span{display:block;font-size:9px;font-weight:700;opacity:.72}
.qstop.now .qnm{color:#2f62c8}
.qtx{font-size:10.8px;font-weight:700;line-height:1.5;color:var(--ink);text-align:center;
  word-break:keep-all;min-height:32px}
.qstop.past .qtx{opacity:.6}
.qtx i{font-style:normal;color:var(--muted);font-weight:600;opacity:.7}
.qstop:hover .qtx{color:var(--blue)}
/* ---- 목표 카드 러너 ---- */
.nsbar{margin-top:15px}
.nsrun{position:absolute;top:-14px;transform:translateX(-50%);font-size:13.5px;line-height:1;
  pointer-events:none;transition:left .4s cubic-bezier(.34,1.3,.5,1);z-index:2;
  filter:drop-shadow(0 1px 2px rgba(15,27,51,.18))}
.nsdone{font-size:10px;font-weight:900;color:#0f7a52;background:rgba(26,156,102,.14);
  border-radius:999px;padding:2px 7px}
.nsleft{font-size:10.5px;font-weight:800;color:#66768f}
.nsleft.ok{color:#1a9c66}
@media (prefers-reduced-motion:reduce){.rrun{animation:none}}
.nsl{font-size:10.5px;font-weight:900;color:#fff;background:var(--ink);border-radius:999px;padding:2px 8px;flex:none}
.nsc{display:inline-flex;align-items:baseline;gap:6px;font-size:11.5px;cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.nsc b{font-weight:800;letter-spacing:-.02em}
.nsc i{font-style:normal;color:var(--muted);font-size:11px}
.nsc em{font-style:normal;font-weight:800;color:#5b86e5}
.nsc em.full{color:#1a9c66}
@media (max-width:560px){
  .north{border-radius:16px}
  .nstop{padding:14px 13px 13px}
  .nsstate h3{font-size:18px}
  .ngnum{font-size:34px}
  .nsq4s{padding:12px 13px 0;gap:7px}
  .nsbhead{padding:14px 13px 8px}
  .nsbhead .btn.primary{margin-left:auto}
  .nsgs{padding:0 13px 14px}
  .nsnum{font-size:17px}
  .nspct{font-size:15px}
  .nsstrip{padding:8px 9px;gap:6px}
  .rtrack{padding:12px 12px 11px;border-radius:15px}
  .rtbig{font-size:30px}
  .qroute{padding:15px 10px 4px}
  .qstop{padding:0 2px}
  .qnm{font-size:9.5px}
  .qtx{font-size:10px;min-height:38px}
}
/* --- 비밀 탭: 꿈 보드 --- */
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);z-index:9999;
  background:rgba(15,27,51,.93);color:#fff;font-size:12.5px;font-weight:700;padding:10px 16px;
  border-radius:999px;opacity:0;pointer-events:none;transition:all .25s;letter-spacing:-.02em}
#toast.on{opacity:1;transform:translate(-50%,0)}
.logo{touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer;user-select:none}
.dmhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.dmt b{font-size:14px;letter-spacing:-.02em;display:block}
.dmt span{font-size:11.5px;color:var(--muted);font-weight:700}
.dmhead .btn{margin-left:auto}
.dmgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.dmc{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;
  background:linear-gradient(160deg,#1e2a44,#2f3f63);box-shadow:0 2px 12px rgba(15,27,51,.08)}
.dmc:hover{transform:translateY(-2px);transition:transform .18s}
.dmimg{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;display:flex;align-items:center;justify-content:center}
.dmimg img{width:100%;height:100%;object-fit:cover;display:block}
.dmph{font-size:34px;opacity:.6}
.dmc.done .dmimg img{filter:saturate(1.05)}
.dmcap{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 11px;color:#fff;
  background:linear-gradient(to top,rgba(10,16,30,.88),rgba(10,16,30,0))}
.dmcap b{display:block;font-size:13.5px;font-weight:800;letter-spacing:-.03em;line-height:1.35}
.dmcap span{display:block;margin-top:3px;font-size:10.5px;opacity:.8;font-weight:700}
.dmstamp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);
  border:3px solid #e05b5b;color:#e05b5b;border-radius:12px;padding:7px 12px;text-align:center;
  background:rgba(255,255,255,.86);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.dmstamp b{display:block;font-size:15px;font-weight:900;letter-spacing:-.03em}
.dmstamp i{display:block;font-style:normal;font-size:9.5px;font-weight:800;margin-top:1px}
.dmn{position:absolute;top:8px;left:8px;font-size:10px;font-weight:800;color:#fff;
  background:rgba(10,16,30,.6);border-radius:999px;padding:3px 8px;backdrop-filter:blur(3px)}
.dthg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.dth{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#f7f9fd}
.dth img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.dth.main{border:2px solid #5b86e5}
.dmain{position:absolute;left:0;bottom:0;right:0;font-size:9px;font-weight:900;color:#fff;
  background:#5b86e5;text-align:center;padding:2px 0}
.dx{position:absolute;top:2px;right:2px;width:18px;height:18px;border:none;border-radius:50%;
  background:rgba(10,16,30,.62);color:#fff;font-size:10px;line-height:1;cursor:pointer;padding:0}
.dth.addb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border:1px dashed var(--line);cursor:pointer;font-family:inherit}
.dth.addb span{font-size:20px;color:var(--muted);line-height:1}
.dth.addb i{font-style:normal;font-size:9.5px;font-weight:800;color:var(--muted)}
.dmupb{display:flex;gap:6px}
.stampbtn{width:100%;border:2px dashed var(--line);background:var(--card);border-radius:12px;padding:12px;
  font-size:12.5px;font-weight:800;color:var(--muted);cursor:pointer;font-family:inherit;letter-spacing:-.02em}
.stampbtn.on{border-style:solid;border-color:#e05b5b;color:#e05b5b;background:rgba(224,91,91,.06)}
@media (max-width:560px){
  .dmgrid{gap:9px}
  .dmcap b{font-size:12.5px}
  .dmstamp b{font-size:13px}
  .dthg{grid-template-columns:repeat(4,1fr);gap:5px}
}
/* --- 진행 단계 --- */
.stepv{display:flex;align-items:center;gap:8px;margin:9px 0 2px}
.sdots{display:inline-flex;gap:3px;flex:none}
.sdots i{display:block;width:16px;height:6px;border-radius:99px;background:#e6eaf2}
.stepv.k1 .sdots i.on{background:#9db7ec}
.stepv.k2 .sdots i.on{background:#7fa2e8}
.stepv.k3 .sdots i.on{background:#5b86e5}
.stepv.k4 .sdots i.on{background:#1a9c66}
.stepv b{font-size:11.5px;font-weight:800;color:#5b86e5;letter-spacing:-.02em}
.stepv.k0 b{color:var(--muted)}
.stepv.k4 b{color:#1a9c66}
.steppick{display:flex;gap:5px;flex-wrap:wrap}
.sbtn{flex:1;min-width:56px;border:1px solid var(--line);background:var(--card);border-radius:10px;
  padding:8px 4px;font-size:11.5px;font-weight:800;color:var(--muted);cursor:pointer;font-family:inherit;
  letter-spacing:-.02em;transition:all .15s}
.sbtn:hover{border-color:#8896ad}
.sbtn.on{background:#5b86e5;border-color:#5b86e5;color:#fff;box-shadow:0 2px 8px rgba(91,134,229,.25)}
.sbtn.on.k0{background:#8e99ab;border-color:#8e99ab;box-shadow:none}
.sbtn.on.k4{background:#1a9c66;border-color:#1a9c66;box-shadow:0 2px 8px rgba(26,156,102,.25)}
@media (max-width:560px){
  .sbtn{min-width:0;padding:8px 2px;font-size:10.5px}
  .sdots i{width:13px}
}
/* --- 프로젝트 토글 목록 --- */
.pjlist.reorder .pj{transition:transform .16s ease}
.pj.dragging{opacity:.55;box-shadow:0 8px 22px rgba(15,27,51,.16)}
.pjbar{display:flex;gap:7px;margin-bottom:9px}
.pjlist{display:grid;gap:8px}
.pj{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;border-left:4px solid #c9d2e2}
.pj.st-doing{border-left-color:#5b86e5}
.pj.st-done{border-left-color:#1a9c66}
.pj.st-hold{border-left-color:#e2a03f}
.pj.open{border-color:#8896ad;box-shadow:0 2px 10px rgba(15,27,51,.05)}
.pjh{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:12px 13px;cursor:pointer;position:relative}
.pjh:hover{background:#fafbfe}
.pjar{font-size:11px;color:var(--muted);flex:none;width:11px}
.pjt{font-size:14.5px;font-weight:800;letter-spacing:-.025em;flex:1;min-width:120px}
.pjtag{font-size:10.5px;font-weight:800;color:var(--muted);background:#f1f4fa;border-radius:999px;padding:2px 8px}
.pjtag.tdone{background:var(--pink-l);color:var(--pink)}
.pjd{font-size:11px;font-weight:700;color:var(--muted)}
.pjd.near{color:#e05b5b}
.pjck{font-size:11px;font-weight:800;color:var(--muted);margin-left:auto}
.pjh .drag{flex:none;border:none;background:none;color:#b9c2d2;font-size:14px;cursor:grab;padding:0 2px;touch-action:none}
.pjbody{padding:2px 14px 14px 28px;border-top:1px dashed var(--line);display:grid;gap:10px}
.pjbody>*:first-child{margin-top:10px}
.pjgoal{font-size:12.5px;font-weight:700;color:var(--ink)}
.pjdesc{font-size:12.5px;line-height:1.65;color:var(--muted);white-space:pre-wrap}
.pjsec{display:grid;gap:5px}
.pjsl{font-size:10.5px;font-weight:900;color:var(--muted);letter-spacing:.03em}
.pjck2,.pjms{display:flex;align-items:flex-start;gap:7px;font-size:12.5px;line-height:1.5;cursor:pointer;padding:4px 0}
.pjck2 .bx,.pjms .bx{flex:none;width:16px;height:16px;border-radius:5px;border:1.5px solid #8290a8;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;margin-top:1px}
.pjck2.on .bx,.pjms.on .bx{background:#5b86e5;border-color:#5b86e5}
.pjck2.on,.pjms.on{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(15,27,51,.25)}
.pjms b{font-weight:800;font-size:11px;color:var(--muted);flex:none}
.pjlk{display:flex;flex-wrap:wrap;gap:6px}
.pjlk a{font-size:11.5px;font-weight:700;color:#5b86e5;border:1px solid var(--line);border-radius:999px;padding:3px 10px;text-decoration:none}
.pjlk span.fchip{font-size:11.5px;font-weight:700;color:var(--muted);background:var(--blue-xl);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.fupb{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:9px}
.fhint{font-size:11px;color:var(--muted);line-height:1.5}
.fsz{font-size:10.5px;font-weight:800;color:var(--muted);background:var(--blue-xl);
  border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin-left:6px;white-space:nowrap}
.frow a.fdl{color:#3b6fd4;text-decoration:none;font-weight:700}
.frow a.fdl:hover{text-decoration:underline}
html[data-theme=dark] .fsz,html[data-theme=dark] .pjlk span.fchip{background:#1e2a3e}
.pjnote{font-size:12px;color:var(--muted);background:#f7f9fd;border-radius:10px;padding:9px 11px;line-height:1.6;white-space:pre-wrap}
.pjacts{display:flex;gap:6px;flex-wrap:wrap;padding-top:2px}
@media (max-width:560px){
  .pjh{padding:11px 11px;gap:6px}
  .pjt{font-size:13.5px;min-width:0;flex-basis:100%}
  .pjbody{padding:2px 12px 12px 12px}
}
/* --- 동기화 --- */
.gsbox{border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:12px;background:var(--card)}
.gshead{display:flex;align-items:center;gap:7px;font-size:13px;margin-bottom:8px;flex-wrap:wrap}
.gsdot{width:9px;height:9px;border-radius:50%;flex:none;background:#c9ced9}
.gsdot.ok{background:#22a06b;box-shadow:0 0 0 3px rgba(34,160,107,.16)}
.gsdot.wait{background:#e2a03f;box-shadow:0 0 0 3px rgba(226,160,63,.16)}
.gsstat{margin-left:auto;font-size:11px;color:var(--muted);font-weight:700}
.gsrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.gsdet{border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-top:10px;background:var(--card)}
.gsdet>summary{cursor:pointer;font-size:12px;font-weight:800;color:var(--muted);list-style:none}
.gsdet>summary::-webkit-details-marker{display:none}
.gsdet>summary:before{content:"▸ "}
.gsdet[open]>summary:before{content:"▾ "}
.gsol{margin:10px 0 6px;padding-left:20px;font-size:12px;line-height:1.85;color:var(--muted)}
.gsol b{color:var(--ink)}
.gsorigin{display:inline-block;margin-top:3px;font-size:11px;background:#f2f5fa;border:1px solid var(--line);border-radius:7px;padding:2px 7px;word-break:break-all}
/* --- 마중 캐릭터 --- */
.ch{display:block;object-fit:contain;image-rendering:auto;-webkit-user-drag:none;user-select:none}
.brand .logo{overflow:hidden;background:linear-gradient(160deg,#f3f7ee,#e4eddc);padding:2px}
.brand .logo .ch{width:100%;height:100%}
.hero{display:flex;align-items:flex-end;gap:16px;position:relative}
.hero .htxt{flex:1;min-width:0}
.heroch{flex:none;width:104px;height:104px;margin-bottom:-6px;position:relative}
.heroch .ch{width:104px;height:104px;filter:drop-shadow(0 8px 16px rgba(15,27,51,.13));
  animation:bob 3.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.tab{display:inline-flex;align-items:center;gap:7px;padding:7px 15px 7px 7px}
.tab .ch{width:26px;height:26px;border-radius:50%;background:#f3f7ee;flex:none;padding:1px;transition:.15s}
.tab.on .ch{background:rgba(255,255,255,.9)}
.tab:hover .ch{transform:scale(1.08)}
.empty .ch{width:96px;height:96px;margin:0 auto 8px;opacity:.95}
.mhead .ic{overflow:hidden;padding:2px;background:#f3f7ee}
.mhead .ic .ch{width:100%;height:100%}
.card .head .t{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 4px}
.card .head .t .ch{width:20px;height:20px;flex:none}
/* 캐릭터 응원 배너 */
.cheer{display:flex;align-items:center;gap:13px;background:linear-gradient(100deg,#f3f7ee,#eef4ff);
  border:1px solid #e3ebdd;border-radius:14px;padding:11px 15px;margin-top:14px}
.cheer .ch{width:52px;height:52px;flex:none}
.cheer .msg{font-size:12.5px;color:#4a5c46;line-height:1.6}
.cheer .msg b{color:#2f6b3f;font-weight:800}
.cheer.done{background:linear-gradient(100deg,#eefaf1,#f5fbe9);border-color:#cfe8d4}
.qsec .ch{width:34px;height:34px;flex:none}
@media(max-width:660px){
  .hero{align-items:center}
  .heroch{width:74px;height:74px}.heroch .ch{width:74px;height:74px}
  .tab .ch{width:22px;height:22px}
}
/* ===== 모바일 최적화 ===== */
@media(max-width:720px){
  body{padding:0 0 env(safe-area-inset-bottom)}
  .app{border-radius:0;min-height:100vh;box-shadow:none}
  .topbar{position:sticky;top:0;z-index:30;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top))}
  .brand h1{font-size:15.5px}.brand p{font-size:10.5px}
  .brand .logo{width:34px;height:34px}
  .hero{padding:16px 16px 0}
  .hero h2{font-size:19px}.hero p{font-size:12px;line-height:1.55}
  .heroch{width:68px;height:68px}.heroch .ch{width:68px;height:68px}
  .stats{padding:14px 16px 0;grid-template-columns:repeat(2,1fr);gap:8px}
  .stat{padding:10px 12px}
  /* 탭: 줄바꿈 대신 가로 스크롤 */
  .tabs{flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x proximity;
    padding:14px 16px 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;scroll-snap-align:start;font-size:12.5px}
  .board{padding:14px 16px 30px}
  .toolbar{gap:6px}
  .toolbar .btn{font-size:12px;padding:9px 12px}
  .search{width:100%;order:9}
  .grid{grid-template-columns:1fr!important}
  .filters{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;padding-bottom:2px}
  .filters::-webkit-scrollbar{display:none}
  .chip{flex:none}
}
@media(max-width:720px){
  /* iOS 입력 확대 방지: 16px 이상 */
  input,select,textarea,.detail-title,.addline input{font-size:16px!important}
  .field label{font-size:11.5px}
  /* 모달 = 전체 화면 시트 */
  .overlay{align-items:flex-end;padding:0;overflow:hidden}
  .modal,.modal.wide{width:100%;max-width:100%;max-height:92vh;border-radius:20px 20px 0 0;
    display:flex;flex-direction:column;min-height:0}
  .mhead{flex:0 0 auto;background:#fff;z-index:5;border-radius:20px 20px 0 0}
  .crumb{flex:0 0 auto}
  .foot{flex:0 0 auto;padding-bottom:calc(14px + env(safe-area-inset-bottom));flex-wrap:wrap}
  .foot span{display:none}
  /* 상세 화면 본문 = 스크롤되는 영역 */
  .form{padding:16px;max-height:none;flex:1 1 auto;min-height:0;
    overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .two,.three{grid-template-columns:1fr;gap:10px}
  /* 캘린더 */
  .calbox{padding:11px}
  .cal-body.big{gap:4px}
  .dcell{min-height:62px;padding:4px;border-radius:9px}
  .dnum{font-size:10.5px}
  .dtag{font-size:9.5px;padding:1px 3px;border-radius:5px}
  .dtags{gap:2px}
  .monthnav{flex-wrap:wrap;gap:6px}
  .monthnav .m{min-width:auto;flex:1}
  /* 목표 패널 */
  .goalpanel{padding:13px}
  .glab b{font-size:14.5px}
  .gsum{font-size:10.5px}
  /* 상세 화면 리스트 */
  .row{gap:8px;font-size:13px}
  .logdate{flex:0 0 62px;font-size:10.5px}
  .addline{flex-wrap:wrap}
  .addline input.dt,.addline input.pg{flex:1 1 100%}
  .addline .btn{flex:none}
  .cheer{padding:10px 12px}
  .cheer .ch{width:44px;height:44px}
  .perf span{font-size:10.5px}
}
.credit{text-align:center;font-size:11.5px;color:#8fa2c2;padding:18px 0 4px}
@media(max-width:660px){
  body{padding:14px 10px 32px}
  .hero h2{font-size:20px}.search{width:100%}
  .two,.three{grid-template-columns:1fr}
  .topmeta{display:none}
  .app{border-radius:18px}
  .board,.hero,.stats,.tabs,.topbar{padding-left:15px;padding-right:15px}
}
/* --- 모바일: 탭 한 화면에 --- */
@media(max-width:720px){
  .tabs{display:grid!important;grid-template-columns:repeat(4,1fr);gap:5px;
    overflow:visible!important;padding:12px 12px 0!important}
  .tab{flex:none;width:100%;flex-direction:column;gap:2px;border-radius:14px;
    padding:7px 2px 6px!important;font-size:11.5px!important;font-weight:700;line-height:1.2}
  .tab .ch{width:24px;height:24px}
  .tab.on{box-shadow:0 4px 12px rgba(37,99,235,.24)}
  .tab[data-k="daily"]::after{display:none}
  .tab[data-k="daily"]{border-width:1.5px;box-shadow:0 2px 8px rgba(246,83,141,.18)}
  .tab[data-k="daily"].on{box-shadow:0 4px 14px rgba(246,83,141,.34)}
  .tfull{display:none}
  .tshort{display:block}
}
@media(max-width:360px){
  .tabs{gap:4px;padding:12px 10px 0!important}
  .tab{font-size:11px!important}
  .tab .ch{width:21px;height:21px}
}

/* --- 접이식 상단 패널 --- */
.foldbox{margin:0 0 4px}
.foldbtn{width:100%;display:flex;align-items:center;gap:9px;text-align:left;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;
  font-family:inherit;color:var(--ink);transition:.15s}
.foldbtn:hover{border-color:#bed3f7;background:var(--blue-xl)}
.foldbtn .fi{flex:none;font-size:12px;color:var(--blue);font-weight:900;width:12px}
.foldbtn .ft{font-size:12.5px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.foldbtn .fs{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted);
  background:var(--blue-xl);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap}
.foldbox.open .foldbtn{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-color:transparent}
.foldin{border:1px solid var(--line);border-top:none;border-radius:0 0 14px 14px;padding:12px 12px 4px;
  display:flex;flex-direction:column;gap:12px;background:var(--card)}
html[data-theme=dark] .foldbtn:hover{background:#1e2a3e}
@media(max-width:560px){.foldbtn .fs{display:none}.foldbtn .ft{white-space:normal}}

/* --- 응원 한 줄 --- */
.stats.cheerbox{display:block}
.cheer{display:flex;align-items:center;gap:13px;padding:14px 17px;border-radius:16px;
  background:linear-gradient(120deg,var(--blue-xl),var(--card));border:1px solid var(--line)}
.cheer .ch{width:38px;height:38px;flex:none}
.cheer img{width:38px;height:38px;flex:none;object-fit:contain}
.cheer p{margin:0;font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.55;
  letter-spacing:-.015em;word-break:keep-all}
@media(max-width:720px){
  .cheer{padding:12px 14px;gap:11px;border-radius:14px}
  .cheer .ch,.cheer img{width:32px;height:32px}
  .cheer p{font-size:12.5px}
}

/* --- 루틴 --- */
.titem .x.rt{font-size:12px;opacity:.4}
.titem .x.rt:hover{opacity:1;color:var(--blue)}
.titem .x.rt.on{opacity:1;color:var(--blue);font-weight:900}
.titem.on .x.rt.on{opacity:.45}
.rtq{font-size:14px;font-weight:800;color:var(--ink);padding:10px 12px;border-radius:11px;
  background:var(--blue-xl);border:1px solid var(--line);margin-bottom:11px;word-break:break-all}
.rtpre{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.rtdays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:9px}
.rtd{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:9px 0;
  font-size:12.5px;font-weight:800;color:var(--muted);cursor:pointer;font-family:inherit}
.rtd:hover{border-color:var(--blue)}
.rtd.on{background:var(--blue);border-color:var(--blue);color:#fff}
.rtrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
.rtrow:last-child{border-bottom:none}
.rtrow.off{opacity:.45}
.rtrow .rtt{flex:1;min-width:0}
.rtrow .rtt b{display:block;font-size:13px;font-weight:800;color:var(--ink);word-break:break-all}
.rtrow .rtt span{font-size:11px;color:var(--muted);font-weight:700}
.tgroup.newcat.rtbtn{color:var(--blue)}

/* --- 설정 메뉴 --- */
.setg{padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:var(--blue-xl);margin-bottom:10px}
.setg.danger{background:#fff6f6;border-color:#ffd7d7}
.setg .seth{font-size:13px;font-weight:900;color:var(--ink);margin-bottom:3px}
.setg .setd{font-size:11.5px;color:var(--muted);line-height:1.55;margin-bottom:9px;word-break:keep-all}
.setg .setd.warn{color:#c0392b;font-weight:700}
.setg .setb{display:flex;gap:7px;flex-wrap:wrap}
/* ---- 개인 금고 ---- */
.vhide{display:block;width:76px;margin:18px auto 4px;text-align:center;font-size:15px;letter-spacing:5px;
  line-height:1;color:#8fa0ba;background:var(--blue-xl);border:1px solid var(--line);border-radius:999px;
  cursor:pointer;user-select:none;-webkit-user-select:none;padding:9px 0 11px;
  font-family:inherit;transition:all .15s}
.vhide:hover,.vhide:active{color:var(--blue);border-color:var(--blue);background:#e7effd}
.vwrap{display:flex;flex-direction:column;gap:9px}
.vwarn{font-size:11.5px;color:var(--muted);line-height:1.6;background:var(--blue-xl);
  border:1px solid var(--line);border-radius:11px;padding:11px 12px;word-break:keep-all}
.vwarn b{color:var(--ink)}
.vwarn.red{background:#fff6f6;border-color:#ffd7d7;color:#c0392b}
.vwarn.red b{color:#c0392b}
.vcaut{font-size:11.5px;line-height:1.6;background:#fff8e8;border:1px solid #f0dcae;color:#8a6410;
  border-radius:11px;padding:11px 12px;word-break:keep-all}
.vcaut b{color:#7a5407}
.vpin{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;
  font-size:17px;font-weight:800;letter-spacing:6px;text-align:center;font-family:inherit;
  color:var(--ink);background:var(--card);box-sizing:border-box}
.vpin:focus{outline:none;border-color:var(--blue)}
.vrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:9px 10px;
  border:1px solid var(--line);border-radius:11px;background:var(--card);margin-bottom:7px}
.vrow .vmain{flex:1 1 150px;min-width:0}
.vsn{font-size:13px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vsi{font-size:11.5px;color:var(--muted);margin-top:2px;word-break:break-all}
.vpw{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;font-weight:700;
  color:var(--blue-d);margin-top:3px;word-break:break-all;letter-spacing:.5px}
.vb{flex:none;border:1px solid var(--line);background:var(--card);border-radius:9px;
  padding:5px 8px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit}
.vb:hover{border-color:var(--blue);color:var(--blue)}
.vb.on{background:var(--blue);border-color:var(--blue);color:#fff}
.vb.del:hover{border-color:var(--danger);color:var(--danger)}
.vin{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:13px;
  font-family:inherit;color:var(--ink);background:var(--card);box-sizing:border-box;margin-bottom:6px}
.vin:focus{outline:none;border-color:var(--blue)}
.vempty{text-align:center;font-size:12px;color:var(--muted);padding:18px 0}
.vforget{text-align:center;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;
  padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.vforget:hover{color:var(--danger)}
.gearwrap{position:relative;display:inline-flex}
.gearwrap .bdot{position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;
  background:var(--danger);border:2px solid var(--card);display:none}
.gearwrap.alert .bdot{display:block}

/* ===== 개인화: 오늘의 한 문장 · 이번 주의 중심 ===== */
.brand h1::after{content:" \2726";color:#ff9cc4;font-size:11px;vertical-align:super;font-weight:900}
.todayline{display:flex;gap:10px;flex-wrap:wrap;padding:14px 24px 0}
.todayline:empty{display:none}
.tl{flex:1 1 250px;min-width:0;display:flex;align-items:center;gap:9px;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 13px;
  font-family:inherit;color:var(--ink);cursor:pointer;transition:.15s}
.tl:hover{border-color:var(--pink-l);background:var(--pink-xl)}
.tl .tld{flex:none;width:7px;height:7px;border-radius:50%;background:var(--pink-s)}
.tl .tlk{flex:none;font-size:11px;font-weight:800;color:var(--pink);letter-spacing:-.02em;white-space:nowrap}
.tl .tlv{flex:1;min-width:0;font-size:13px;font-weight:700;letter-spacing:-.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl .tlv.ph{color:var(--muted);font-weight:600}
.tl .tle{flex:none;font-size:11px;color:var(--muted)}
input.tlin{width:100%;font-size:13px;padding:4px 8px;border:1.5px solid var(--pink-s);
  border-radius:8px;background:#fff;outline:none;color:var(--ink);font-family:inherit}
@media(max-width:560px){.todayline{padding:12px 16px 0}.tl{flex:1 1 100%}}

/* ===== 감성 통계 ===== */
.stat i.sd{display:inline-block;width:5px;height:5px;border-radius:50%;
  background:#c3cee2;margin-right:6px;vertical-align:middle}
html[data-theme=dark] .stat i.sd{background:#3b465c}
.statsay{grid-column:1/-1;display:flex;align-items:center;gap:11px;margin-top:2px;
  background:linear-gradient(100deg,#f1fbf5,var(--blue-xl));
  border:1px solid var(--line);border-left:3px solid var(--ok);
  border-radius:14px;padding:11px 15px}
.statsay img{width:34px;height:34px;flex:none;object-fit:contain}
.statsay p{margin:0;font-size:13px;font-weight:700;color:var(--ink);line-height:1.55;letter-spacing:-.02em}
.statsay p b{color:#127a55}

/* ===== 더보기(⋯) 메뉴 ===== */
.moreWrap{position:relative}
.btn.more{padding:9px 14px;font-size:15px;line-height:1;font-weight:800}
.moremenu{display:none;position:absolute;top:calc(100% + 6px);right:0;z-index:60;min-width:176px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;
  box-shadow:0 10px 30px rgba(13,31,66,.18)}
.moreWrap.open .moremenu{display:block}
.moremenu .mi{display:block;width:100%;text-align:left;background:none;border:0;border-radius:10px;
  padding:9px 11px;font-size:13px;font-weight:700;color:var(--ink);font-family:inherit;cursor:pointer;
  letter-spacing:-.02em}
.moremenu .mi:hover{background:var(--blue-xl);color:var(--blue)}

/* ===== 빠른 메모 ===== */
.qmwrap{display:flex;flex-direction:column;gap:11px}
.qmta{width:100%;font-size:15px;font-weight:600;line-height:1.6;padding:13px 14px;
  border:1.5px solid var(--line);border-radius:14px;outline:none;resize:vertical;
  font-family:inherit;color:var(--ink);background:#fff}
.qmta:focus{border-color:var(--pink-s);box-shadow:0 0 0 3px var(--pink-xl)}
.qmhint{font-size:12px;color:var(--muted);line-height:1.6}
.qmhint b{color:var(--pink)}
.qmact{display:flex;gap:8px;flex-wrap:wrap}
.qmact .btn.primary{background:var(--pink);border-color:var(--pink);box-shadow:0 6px 18px rgba(216,27,96,.24)}
.qmact .btn.primary:hover{background:var(--pink-s);border-color:var(--pink-s)}

/* ===== 인박스 ===== */
.foldbox.ib .foldbtn .fi,.foldbox.ib .foldbtn .ft{color:var(--pink)}
.foldbox.ib .foldbtn:hover{border-color:var(--pink-l);background:var(--pink-xl)}
.foldbox.ib .foldbtn .fs{background:var(--pink-xl);color:var(--pink);border-color:var(--pink-l)}
.foldbox.ib .foldin{gap:0;padding:6px 13px 9px}
.ibrow{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px dashed var(--line)}
.ibrow:last-child{border-bottom:0}
.ibt{flex:1;min-width:0;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibd{flex:none;font-size:11px;color:var(--muted)}
.ibrow .ibb{flex:none;background:none;border:1px solid var(--line);border-radius:8px;color:#5a6c8c;
  font-size:11px;font-weight:700;padding:3px 8px;font-family:inherit;cursor:pointer;white-space:nowrap;transition:.15s}
.ibrow .ibb:hover{border-color:var(--pink-l);color:var(--pink);background:var(--pink-xl)}
.ibrow .ibb.dl:hover{border-color:#f6c2ce;color:var(--danger);background:#fff5f7}

/* ===== 핑크 5% 반복 ===== */
.dcell.today .dnum::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--pink-s);margin-left:4px;vertical-align:middle}
.cheer{border-left:3px solid var(--ok)}

/* ===== 다크 보정 ===== */
html[data-theme=dark] .tl{background:#1e2124}
html[data-theme=dark] .tl:hover{background:#2c1f2a;border-color:#5d2c3f}
html[data-theme=dark] input.tlin{background:#1e2124;color:#e7edf8}

/* ===== 탭 캐릭터 통일 (얼굴 원형 크롭) ===== */
.chf{display:block;flex:none;width:28px;height:28px;border-radius:50%;overflow:hidden;
  background:#f3f7ee;position:relative;transition:.15s}
.chf img{position:absolute;width:160%;height:160%;left:-30%;top:-16.25%;
  object-fit:contain;transition:.15s;filter:saturate(.6) opacity(.78)}
.tab.on .chf{background:rgba(255,255,255,.94)}
.tab.on .chf img{filter:none}
.tab:hover .chf img{filter:saturate(.92) opacity(.96)}
html[data-theme=dark] .chf{background:#3b4d24}

/* ===== 통계 더보기 ===== */
.statmore{display:none}
.stats.smore .stat{display:block}

/* ===== 모바일 재배치 · 통계 축약 · 글자 하한 ===== */
@media(max-width:720px){
  /* 순서: 상단바 → 오늘의 한 문장 → 탭 → (새 기록·검색·내용) → 소개 → 통계 */
  .app{display:flex;flex-direction:column}
  .app>.topbar{order:0}
  .app>.todayline{order:1}
  .app>.tabs{order:2}
  .app>.board{order:3}
  .app>.hero{order:4}
  .app>.stats{order:5}
  .app>.hero{border-top:1px solid var(--line);padding-top:18px;margin-top:6px}
  .app>.stats{padding-bottom:22px}

  /* 통계는 핵심 2개만, 나머지는 더보기 */
  .stats{grid-template-columns:repeat(2,1fr)}
  .stats .stat:nth-child(n+3){display:none}
  .stats.smore .stat{display:block}
  .statmore{display:block;grid-column:1/-1;border:1px solid var(--line);background:var(--card);
    color:var(--muted);border-radius:12px;padding:9px;font-size:12px;font-weight:700;
    font-family:inherit;cursor:pointer;letter-spacing:-.02em}
  .statmore:hover{border-color:#bed3f7;color:var(--blue);background:var(--blue-xl)}

  /* 탭 캐릭터 */
  .chf{width:26px;height:26px}

  /* 글자 하한 */
  .tab{font-size:11.5px!important}
  .chip{font-size:11.5px}
  .dtag{font-size:9.5px!important}
  .dmore{font-size:10px}
  .cal-head div,.mcal .wk div,.wday .wdw{font-size:11px}
  .hlhint,.legend,.ehint,.setd,.qmhint,.pgt{font-size:12px}
  .meta,.rollb,.titem .x.tm,.gcnt,.subhd .gcnt,.foldbtn .fs{font-size:11px}
  .card .head .acts button b,.card .head .acts a.lnk b{font-size:11px}
  .cqh,.gpct,.stuckrow .st em{font-size:11px}
}
@media(max-width:360px){
  .tab{font-size:11px!important}
  .chf{width:24px;height:24px}
}
html[data-theme=dark] .statmore{background:#1e2124}
html[data-theme=dark] .statmore:hover{background:#1e2a3e}
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo" id="tbLogo" onclick="logoTap()"></div>
      <div><h1>My Life OS</h1><p>hyein's workspace · 2026</p></div>
    </div>
    <div class="topmeta"><span id="tbNow">workspace</span><span class="dot"></span><span id="clock">00:00</span></div>
  </div>

  <div class="hero">

const FEED=(function(){try{return JSON.parse(document.getElementById("feed").textContent)||{};}catch(e){return {};}})();
let eStudyD=null;
let LOSTMODE=false, LOSTFROM="", ALLOWSHRINK=false;
/* 이 앱이 지금까지 쓴 저장 이름표만 본다 (다른 앱·데모 저장소는 절대 건드리지 않음) */
const OLDKEYS=["hyein_work_os_v3","hyein_work_os_v2","hyein_work_os","hyein_life_demo_v1","_rescue_before_restore"];
const KEY="hyein_work_os_v3";
const STATUSES=["할일","진행중","대기","완료"];
const MSTATUS=["아이디어","기획","촬영","편집","예약","발행"];
const WD=["월","화","수","목","금","토","일"];
let DATA=load(), cur="daily", filter="ALL", editing=null, detailId=null;
let calY=new Date().getFullYear(), calM=new Date().getMonth(), dayCur=null;
let daySel=todayStr();
let noClick=false;

/* 저장소 어딘가에 남아 있는 우리 앱 데이터를 찾아본다 (키 이름이 바뀌었어도) */
function findStore(){
  let best=null;
  try{
    for(let i=0;i<OLDKEYS.length;i++){
      const k=OLDKEYS[i];
      if(k===KEY) continue;
      const raw=localStorage.getItem(k);
      if(!raw||raw.length<200||raw.charAt(0)!=="{") continue;
      let o=null; try{o=JSON.parse(raw);}catch(e){continue;}
      if(!o||typeof o!=="object") continue;
      const looks=Object.keys(o).some(kk=>o[kk]&&typeof o[kk]==="object"&&typeof o[kk].type==="string");
      if(!looks) continue;
      if(!best||raw.length>best.raw.length) best={key:k,raw:raw};
    }
  }catch(e){}
  return best;
}
/* 예전에 이 앱을 쓴 흔적이 있는가 (있는데 기록이 없다 = 사고) */
function usedBefore(){
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i)||"";
      if(k==="hyein_theme"||k==="hyein_gsync_v1"||k==="hyein_vault_v1") return true;
      if(/_rescue|_before_restore|work_os|life_demo/.test(k)) return true;
    }
  }catch(e){}
  return false;
}
function load(){
  try{const raw=localStorage.getItem(KEY);
    if(raw) return normalize(JSON.parse(raw));}catch(e){}
  const alt=findStore();                    // 키가 바뀐 경우 자동으로 되살림
  if(alt){
    try{
      const d=normalize(JSON.parse(alt.raw));
      LOSTFROM=alt.key;
      return d;
    }catch(e){}
  }
  LOSTMODE=usedBefore();                    // 정말 아무것도 없다 → 복구 화면
  return normalize(JSON.parse(JSON.stringify(SEED)));
}
function normalize(d){
  const ord=Array.isArray(d.__order)?d.__order:null;
  const bku=d.__backup||"";
  const mig=d.__mig||{};
  const meta={};                    // __ui · __inbox 같은 설정값 보존
  Object.keys(d).forEach(k=>{ if(k.indexOf("__")===0) meta[k]=d[k]; });
  const m={};                       // SEED 순서 유지 + 새로 생긴 탭 자동 추가
  Object.keys(SEED).forEach(k=>{ m[k]= d[k] || JSON.parse(JSON.stringify(SEED[k])); });
  Object.keys(d).forEach(k=>{ if(k.indexOf("__")!==0 && !m[k]) m[k]=d[k]; });
  d=m;
  Object.keys(d).forEach(k=>{
    const s=d[k];
    if(s.type==="dream"){
      s.secret=true;s.label=s.label||"🌙 꿈";
      s.items=(s.items||[]).map(x=>{
        let g=Array.isArray(x.imgs)?x.imgs.filter(Boolean):[];
        if(!g.length&&x.img)g=[x.img];
        return {id:x.id||uid(),title:x.title||"",imgs:g.slice(0,10),img:g[0]||"",when:x.when||"",done:!!x.done,doneAt:x.doneAt||""};
      });
      return;
    }
    if(s.type==="muse"&&!s.account){ d[k]=JSON.parse(JSON.stringify(SEED.muse)); return; }
    if(s.type==="muse"){
      const fw=(FEED.muse&&FEED.muse.week)||null;
      if(fw&&fw.start&&(!s.week||!s.week.start||fw.start>s.week.start)) s.week=JSON.parse(JSON.stringify(fw));
      s.followers=s.followers||{cur:0,goal:1000};
      s.history=Array.isArray(s.history)?s.history:[{d:todayStr(),n:s.followers.cur}];
    }
    if(k==="project"&&!s.north){s.north=JSON.parse(JSON.stringify(SEED.project.north));}
    if(k==="project"&&s.north&&Array.isArray(s.north.goals)){
      const KD={n1:"core",n2:"core",n3:"sub",n4:"sub",n5:"core"};
      s.north.goals.forEach(g=>{if(g.kind!=="core"&&g.kind!=="sub")g.kind=KD[g.id]||"core";});
    }

/* 길게 눌러 끌기 */
let DRAG=null;
function tabDown(ev,k){
  if(DRAG)return;
  DRAG={k:k,sx:ev.clientX,sy:ev.clientY,on:false,touch:ev.pointerType!=="mouse",t:null};
  DRAG.t=DRAG.touch?setTimeout(startDrag,260):null;   // 마우스는 6px 이동해야 시작
  document.addEventListener("pointermove",dragMove);
  document.addEventListener("pointerup",dragUp);
  document.addEventListener("pointercancel",dragUp);
  document.addEventListener("touchmove",blockScroll,{passive:false});
}
function startDrag(){
  if(!DRAG||DRAG.on)return;
  DRAG.on=true;
  const el=document.querySelector('.tab[data-k="'+DRAG.k+'"]');
  if(el)el.classList.add("dragging");
  document.getElementById("tabs").classList.add("reorder");
  if(navigator.vibrate)try{navigator.vibrate(12);}catch(e){}
}
function blockScroll(ev){if(DRAG&&DRAG.on&&ev.cancelable)ev.preventDefault();}
function dragMove(ev){
  if(!DRAG)return;
  if(!DRAG.on){
    const dist=Math.abs(ev.clientX-DRAG.sx)+Math.abs(ev.clientY-DRAG.sy);
    if(DRAG.touch){ if(dist>10){clearTimeout(DRAG.t);endDrag();} return; }
    if(dist>6) startDrag(); else return;
  }
  if(!document.elementFromPoint)return;
  const el=document.elementFromPoint(ev.clientX,ev.clientY);
  const tab=el&&el.closest?el.closest(".tab"):null;
  if(!tab||!tab.dataset.k||tab.dataset.k===DRAG.k)return;
  const a=tabKeys(),i=a.indexOf(DRAG.k),j=a.indexOf(tab.dataset.k);
  if(i<0||j<0)return;
  a.splice(j,0,a.splice(i,1)[0]);
  DATA.__order=a;save();renderTabs();
  const nw=document.querySelector('.tab[data-k="'+DRAG.k+'"]');
  if(nw)nw.classList.add("dragging");
  document.getElementById("tabs").classList.add("reorder");
}
function dragUp(){ if(DRAG&&DRAG.on){noClick=true;setTimeout(()=>{noClick=false;},350);} endDrag(); }
function endDrag(){
  if(DRAG&&DRAG.t)clearTimeout(DRAG.t);
  document.removeEventListener("pointermove",dragMove);
  document.removeEventListener("pointerup",dragUp);
  document.removeEventListener("pointercancel",dragUp);
  document.removeEventListener("touchmove",blockScroll);
  const wasOn=DRAG&&DRAG.on;DRAG=null;
  const t=document.getElementById("tabs");
  if(t){t.classList.remove("reorder");[...t.querySelectorAll(".dragging")].forEach(x=>x.classList.remove("dragging"));}
  if(wasOn)setTimeout(()=>{},0);
}

function rtOf(t){return t&&t.rt?rts().find(r=>r.id===t.rt):null;}
function rtLabel(r){
  const d=(r.days||[]).slice().sort((a,b)=>a-b);
  if(d.length===7)return "매일";
  if(d.length===5&&d.join()==="0,1,2,3,4")return "평일";
  if(d.length===2&&d.join()==="5,6")return "주말";
  return d.map(x=>WD[x]).join("·");
}
function syncRoutines(k){
  if(k<todayStr())return;
  const s=ds(),rs=rts(); if(!rs.length)return;
  const w=dowOf(k),skip=(s.skip&&s.skip[k])||[];
  if(!s.days)s.days={};
  rs.forEach(r=>{
    if(r.off)return;
    if(r.since&&k<r.since)return;
    if((r.days||[]).indexOf(w)<0)return;
    if(skip.indexOf(r.id)>=0)return;
    if(dayTodos(k).some(x=>x.rt===r.id))return;
    if(!s.days[k])s.days[k]=[];
    s.days[k].push({id:uid(),cat:r.cat,part:r.part==="pm"?"pm":"am",text:r.text,done:false,rt:r.id});
  });
}
let rtPick={tid:null,id:null,days:[]};
function rtDaysHtml(){
  return WD.map((n,i)=>`<button type="button" class="rtd ${rtPick.days.indexOf(i)>=0?"on":""}" onclick="rtTog(${i})">${n}</button>`).join("");
}
function rtPaint(){const e=document.getElementById("rtDays");if(e)e.innerHTML=rtDaysHtml();}
function rtTog(i){
  const p=rtPick.days.indexOf(i);
  if(p>=0)rtPick.days.splice(p,1);else rtPick.days.push(i);
  rtPaint();
}
function rtSet(mode){
  rtPick.days = mode==="every"?[0,1,2,3,4,5,6] : mode==="week"?[0,1,2,3,4] : [5,6];
  rtPaint();
}

  const s=ds();

  if(r){ r.days=rtPick.days.slice(); r.text=t.text; r.cat=t.cat; r.part=t.part; r.off=false; }
  else{
    r={id:uid(),cat:t.cat,part:t.part==="pm"?"pm":"am",text:t.text,
       days:rtPick.days.slice(),since:daySel,off:false};
    rts().push(r); t.rt=r.id;

/* ---- 못 한 할 일 자동 이월 ---- */
const ROLLDAYS=14;
function autoRoll(){
  const s=ds(); if(!s.days) s.days={};
  const t=todayStr(), lim=addDays(t,-ROLLDAYS);
  let n=0;
  Object.keys(s.days).forEach(k=>{
    if(k>=t||k<lim) return;
    const src=s.days[k]||[], stay=src.filter(x=>x.done||x.rt), go=src.filter(x=>!x.done&&!x.rt);
    if(!go.length) return;
    if(!s.days[t]) s.days[t]=[];
    const have=s.days[t].map(x=>x.text);
    go.forEach(x=>{
      if(have.indexOf(x.text)>=0) return;
      x.roll=(+x.roll||0)+1; x.from=x.from||k;
      s.days[t].push(x); have.push(x.text); n++;
    });
    s.days[k]=stay;
  });
  return n;
}
function pushDaily(id){
  const s=ds(), day=daySel, nxt=addDays(day,1);
  const list=dayTodos(day), x=list.findIndex(v=>v.id===id);
  if(x<0)return;
  const t=list[x], name=t.text||"할 일";
  if(t.done){try{toast("이미 끝낸 일이에요 :)");}catch(e){}return;}
  let skipped=false;
  if(t.rt){
    if(!s.skip)s.skip={}; if(!s.skip[day])s.skip[day]=[];
    if(s.skip[day].indexOf(t.rt)<0){s.skip[day].push(t.rt);skipped=true;}
  }
  if(!s.days)s.days={};
  s.days[day]=list.filter(v=>v.id!==id);
  if(!s.days[nxt])s.days[nxt]=[];
  const moved={id:uid(),cat:t.cat,part:t.part==="pm"?"pm":"am",text:t.text,done:false,
    roll:(+t.roll||0)+1, from:t.from||day, rt:t.rt||""};
  s.days[nxt].push(moved);
  save();render();
  const short=name.length>12?name.slice(0,12)+"…":name;
  toastU("→ '"+short+"' "+korDate(nxt)+"로 미뤘어요",function(){
    const b=ds();
    b.days[nxt]=(b.days[nxt]||[]).filter(v=>v.id!==moved.id);
    if(skipped&&b.skip&&b.skip[day])b.skip[day]=b.skip[day].filter(r=>r!==t.rt);
    if(!b.days[day])b.days[day]=[];
    b.days[day].splice(Math.min(x,b.days[day].length),0,t);
    daySel=day;save();render();toast("↩ 되돌렸어요");
  });
}

function editDaily(ev,id){
  if(ev){ev.preventDefault();ev.stopPropagation();}
  if(noClick||(TDRAG&&TDRAG.on))return;
  const t=dayTodos(daySel).find(x=>x.id===id); if(!t)return;
  const sp=document.querySelector('.titem[data-id="'+id+'"] .ttx'); if(!sp)return;
  if(sp.querySelector("input"))return;
  const old=t.text;
  const inp=document.createElement("input");
  inp.type="text"; inp.className="ttxin"; inp.value=old; inp.setAttribute("autocomplete","off");
  sp.textContent=""; sp.appendChild(inp);
  let closed=false;
  const commit=ok=>{
    if(closed)return; closed=true;
    const v=(inp.value||"").trim();
    let msg="";
    if(ok&&v&&v!==old){
      t.text=v;
      const r=rtOf(t);
      if(r&&r.text!==v){r.text=v;msg="루틴 문구도 같이 바뀌었어요";}
    }
    render();
    if(msg)toast("♺ "+msg);
  };
  inp.addEventListener("pointerdown",e=>e.stopPropagation());
  inp.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();});
  inp.addEventListener("keydown",e=>{
    e.stopPropagation();
    if(e.key==="Enter"){e.preventDefault();commit(true);}
    else if(e.key==="Escape"){e.preventDefault();commit(false);}
  });
  inp.addEventListener("blur",()=>commit(true));
  inp.focus();
  try{inp.setSelectionRange(old.length,old.length);}catch(e){}
}
/* ---- 할 일 순서 바꾸기 (⠿ 잡고 끌기 / 길게 눌러 끌기) ---- */
let TDRAG=null;
function dailyPaint(){
  const el=document.querySelector(".tlist"); if(!el)return;
  el.innerHTML=dailyGroups();
  el.classList.add("reorder");
  if(TDRAG){const nw=el.querySelector('.titem[data-id="'+TDRAG.id+'"]');if(nw)nw.classList.add("dragging");}
}
function tdDown(ev,id,now){
  if(TDRAG)return;
  const g=ev.target;
  if(!now&&g&&g.closest&&g.closest("button,input,textarea,select,a"))return;
  TDRAG={id:id,sx:ev.clientX,sy:ev.clientY,on:false,touch:ev.pointerType!=="mouse",t:null};
  if(now){tdStart();}
  else{TDRAG.t=TDRAG.touch?setTimeout(tdStart,320):null;}
  document.addEventListener("pointermove",tdMove);
  document.addEventListener("pointerup",tdUp);
  document.addEventListener("pointercancel",tdUp);
  document.addEventListener("touchmove",tdBlock,{passive:false});
}
function tdStart(){
  if(!TDRAG)return;
  TDRAG.on=true;
  const l=document.querySelector(".tlist"); if(l)l.classList.add("reorder");
  const el=document.querySelector('.titem[data-id="'+TDRAG.id+'"]'); if(el)el.classList.add("dragging");
  if(navigator.vibrate){try{navigator.vibrate(12);}catch(e){}}
}
function tdBlock(ev){if(TDRAG&&TDRAG.on&&ev.cancelable)ev.preventDefault();}
function tdMove(ev){
  if(!TDRAG)return;
  if(!TDRAG.on){
    const d=Math.abs(ev.clientX-TDRAG.sx)+Math.abs(ev.clientY-TDRAG.sy);
    if(TDRAG.touch){if(d>10){clearTimeout(TDRAG.t);tdEnd();}return;}
    if(d>6){tdStart();}else{return;}
  }
  if(!document.elementFromPoint)return;
  const under=document.elementFromPoint(ev.clientX,ev.clientY); if(!under||!under.closest)return;
  const arr=(ds().days||{})[daySel]; if(!arr)return;
  const me=arr.find(x=>x.id===TDRAG.id); if(!me)return;
  const i=arr.indexOf(me);
  const grp=under.closest(".tgroup"),sub=under.closest(".subg");
  const cat=grp?(grp.dataset.cat||""):"";
  const part=sub?sub.dataset.part:null;
  const tgt=under.closest(".titem");
  let moved=false;
  if(tgt&&tgt.dataset.id&&tgt.dataset.id!==TDRAG.id){
    const j=arr.findIndex(x=>x.id===tgt.dataset.id);
    if(j<0)return;
    arr.splice(j,0,arr.splice(i,1)[0]);
    moved=true;
  }else if(grp&&cat&&cat!==me.cat){
    arr.splice(i,1);
    let last=-1; arr.forEach((x,k)=>{if(x.cat===cat)last=k;});
    arr.splice(last+1,0,me);
    moved=true;
  }
  if(cat&&me.cat!==cat){me.cat=cat;moved=true;}
  if(part&&(me.part==="pm"?"pm":"am")!==part){me.part=part;moved=true;}
  if(moved){save();dailyPaint();}
}
function tdSwallow(e){e.preventDefault();e.stopPropagation();}
function tdUp(){
  const moved=!!(TDRAG&&TDRAG.on);
  tdEnd();
  if(moved){
    noClick=true;
    document.addEventListener("click",tdSwallow,true);
    setTimeout(function(){noClick=false;document.removeEventListener("click",tdSwallow,true);},350);
    render();
  }
}
function tdEnd(){
  if(TDRAG&&TDRAG.t)clearTimeout(TDRAG.t);
  TDRAG=null;
  const l=document.querySelector(".tlist"); if(l)l.classList.remove("reorder");
  [].forEach.call(document.querySelectorAll(".titem.dragging"),x=>x.classList.remove("dragging"));
  document.removeEventListener("pointermove",tdMove);
  document.removeEventListener("pointerup",tdUp);
  document.removeEventListener("pointercancel",tdUp);
  document.removeEventListener("touchmove",tdBlock);
}

function dailyMonth(){

const GS_KEY="hyein_gsync_v1",GS_FILE="mylifeos.json",GS_SCOPE="https://www.googleapis.com/auth/drive.file";
let gsMeta=gsLoad(),gsTok=null,gsExp=0,gsBusy=false,gsTimer=null;
function gsLoad(){try{return JSON.parse(localStorage.getItem(GS_KEY))||{};}catch(e){return {};}}
function gsSaveMeta(){try{localStorage.setItem(GS_KEY,JSON.stringify(gsMeta));}catch(e){}}
function gsOn(){return !!(gsMeta.cid&&gsMeta.use);}
function gsReady(){return !!(window.google&&window.google.accounts&&window.google.accounts.oauth2);}
function gsDev(){if(!gsMeta.dev){gsMeta.dev=/Mobi|Android|iPhone|iPad/.test(navigator.userAgent)?"휴대폰":"PC";gsSaveMeta();}return gsMeta.dev;}
function gsTime(t){const d=new Date(t||gsMeta.last||Date.now());return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function gsStatus(t){const e=document.getElementById("gsStat");if(e)e.textContent=t;const b=document.getElementById("gsDot");if(b)b.className="gsdot "+(gsTok?"ok":(gsOn()?"wait":"off"));}
function gsAuth(inter){
  return new Promise((res,rej)=>{
    if(gsTok&&Date.now()<gsExp-60000)return res(gsTok);
    if(!gsMeta.cid)return rej(new Error("클라이언트 ID를 먼저 넣어주세요"));
    if(!gsReady())return rej(new Error("구글 로그인 스크립트를 못 불러왔어요"));
    let done=false;
    const tc=window.google.accounts.oauth2.initTokenClient({
      client_id:gsMeta.cid,scope:GS_SCOPE,
      callback:r=>{done=true;if(r&&r.access_token){gsTok=r.access_token;gsExp=Date.now()+((+r.expires_in||3600)*1000);res(gsTok);}else rej(new Error("인증이 취소됐어요"));},
      error_callback:e=>{done=true;rej(new Error("인증 실패 ("+((e&&e.type)||"unknown")+")"));}
    });
    try{tc.requestAccessToken(inter?{}:{prompt:""});}catch(e){rej(e);}
    setTimeout(()=>{if(!done)rej(new Error("응답이 없어요. 팝업이 차단됐는지 확인해주세요"));},60000);
  });
}
async function gsApi(url,opt){
  let t=await gsAuth(false);
  opt=opt||{};opt.headers=Object.assign({Authorization:"Bearer "+t},opt.headers||{});
  let r=await fetch(url,opt);
  if(r.status===401||r.status===403){gsTok=null;t=await gsAuth(true);opt.headers.Authorization="Bearer "+t;r=await fetch(url,opt);}
  return r;
}
async function gsFind(){
  if(gsMeta.fid)return gsMeta.fid;
  const q=encodeURIComponent("name='"+GS_FILE+"' and trashed=false");
  const r=await gsApi("https://www.googleapis.com/drive/v3/files?spaces=drive&fields=files(id)&q="+q);
  if(!r.ok)throw new Error("드라이브 조회 실패 ("+r.status+")");
  const j=await r.json();
  if(j.files&&j.files.length){gsMeta.fid=j.files[0].id;gsSaveMeta();return gsMeta.fid;}
  return null;
}
async function gsPull(){
  const id=await gsFind();if(!id)return null;
  const r=await gsApi("https://www.googleapis.com/drive/v3/files/"+id+"?alt=media");
  if(r.status===404){gsMeta.fid=null;gsSaveMeta();return null;}
  if(!r.ok)throw new Error("내려받기 실패 ("+r.status+")");
  const j=await r.json();
  return (j&&j.data)?j:null;
}
async function gsPush(){
  const at=Date.now();
  const body=JSON.stringify({v:1,at:at,dev:gsDev(),data:DATA});
  const id=await gsFind();let r;
  if(id){
    r=await gsApi("https://www.googleapis.com/upload/drive/v3/files/"+id+"?uploadType=media&fields=id",
      {method:"PATCH",headers:{"Content-Type":"application/json"},body:body});
  }else{
    const bd="mlos"+at,meta=JSON.stringify({name:GS_FILE,mimeType:"application/json"});
    const payload="--"+bd+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+meta
      +"\r\n--"+bd+"\r\nContent-Type: application/json\r\n\r\n"+body+"\r\n--"+bd+"--";
    r=await gsApi("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",
      {method:"POST",headers:{"Content-Type":"multipart/related; boundary="+bd},body:payload});
  }
  if(!r.ok)throw new Error("올리기 실패 ("+r.status+")");
  const j=await r.json().catch(()=>({}));

async function gsSync(force){
  if(gsBusy)return;if(!gsOn()&&!force)return;
  if(LOSTMODE)return;
  if(!force&&gsShrunk()){try{gsStatus("⏸ 안전 정지 — 확인 필요");}catch(e){}return;}
  gsBusy=true;gsStatus("동기화 중…");
  try{
    const r=await gsPull();
    if(!r){await gsPush();gsStatus("올렸어요 · "+gsTime());}
    else if(r.at>(gsMeta.at||0)){
      if(gsMeta.dirty){
        const take=confirm("다른 기기("+(r.dev||"?")+", "+gsTime(r.at)+")에서 더 최근에 저장했어요.\n\n확인 = 그 내용을 받아오기 (이 기기의 최근 변경은 사라짐)\n취소 = 이 기기 내용으로 덮어쓰기");
        if(take){gsAdopt(r);gsStatus("받아왔어요 · "+gsTime());}
        else{await gsPush();gsStatus("덮어썼어요 · "+gsTime());}
      }else{gsAdopt(r);gsStatus("받아왔어요 · "+gsTime());}
    }
    else if(gsMeta.dirty){await gsPush();gsStatus("올렸어요 · "+gsTime());}

}

function gsShrunk(){

    if(ALLOWSHRINK) return false;

function gsTouch(){

}

function setGoalV(k,v){
  const s=ms(),n=Math.max(0,+v||0);

    const t=todayStr(),last=s.history[s.history.length-1];
    if(last&&last.d===t)last.n=n; else s.history.push({d:t,n:n});
    if(s.history.length>60)s.history=s.history.slice(-60);
  } else if(k==="fgoal")s.followers.goal=Math.max(1,n);
  else if(k==="up")s.monthGoal.uploads=Math.max(1,n); else if(k==="vw")s.monthGoal.views=Math.max(1,n);

function addEntry(){

function delEntry(id){

}
function openTypes(){

function addType(){

function setTypeName(id,v){const t=typeOf(id);t.name=(v||"").trim()||t.name;save();render();}

function delType(id){
  const s=hs();
  if((s.types||[]).length<=1){alert("최소 1개의 종류는 필요해요.");return;}
  if(!confirm("이 종류의 기록도 함께 삭제됩니다. 진행할까요?"))return;
  s.types=s.types.filter(t=>t.id!==id);
  Object.keys(s.entries).forEach(k=>{
    s.entries[k]=s.entries[k].filter(e=>e.type!==id);
    if(!s.entries[k].length) delete s.entries[k];});
  if(filter===id) filter="ALL";
  save();openTypes();render();
}

/* ---- 카드 순서 드래그 ---- */
let CDRAG=null;
function cardsArr(){return (DATA[cur]&&DATA[cur].items)||[];}
function cardDown(ev,id,now){
  if(CDRAG)return;
  if(!now){
    const t=ev.target;
    if(t&&t.closest&&t.closest("button,a,input,textarea,select,label"))return;
  }
  CDRAG={id:id,sx:ev.clientX,sy:ev.clientY,on:false,touch:ev.pointerType!=="mouse",t:null};
  if(now){cStart();}
  else{CDRAG.t=CDRAG.touch?setTimeout(cStart,300):null;}
  document.addEventListener("pointermove",cMove);
  document.addEventListener("pointerup",cUp);
  document.addEventListener("pointercancel",cUp);
  document.addEventListener("touchmove",cBlock,{passive:false});
}
function cStart(){
  if(!CDRAG)return;
  CDRAG.on=true;
  const g=document.querySelector(".grid,.pjlist");if(g)g.classList.add("reorder");
  const el=document.querySelector('.card[data-id="'+CDRAG.id+'"],.pj[data-id="'+CDRAG.id+'"]');if(el)el.classList.add("dragging");
  if(navigator.vibrate){try{navigator.vibrate(12);}catch(e){}}
}
function cBlock(ev){if(CDRAG&&CDRAG.on&&ev.cancelable)ev.preventDefault();}
function cardsPaint(){
  const g=document.querySelector(".grid,.pjlist");if(!g)return;
  const mk=g.classList.contains("pjlist")?pjRow:(DATA[cur].type==="muse"?museCard:taskCard);
  g.innerHTML=visible().map(mk).join("");
  g.classList.add("reorder");
  if(CDRAG){const nw=g.querySelector('[data-id="'+CDRAG.id+'"]');if(nw)nw.classList.add("dragging");}
}
function cMove(ev){
  if(!CDRAG)return;
  if(!CDRAG.on){
    const d=Math.abs(ev.clientX-CDRAG.sx)+Math.abs(ev.clientY-CDRAG.sy);
    if(CDRAG.touch){if(d>10){clearTimeout(CDRAG.t);cEnd();}return;}
    if(d>6){cStart();}else{return;}
  }
  if(!document.elementFromPoint)return;
  const el=document.elementFromPoint(ev.clientX,ev.clientY);
  const c=el&&el.closest?el.closest(".card,.pj"):null;
  if(!c||!c.dataset.id||c.dataset.id===CDRAG.id)return;
  const a=cardsArr();
  let i=-1,j=-1;
  a.forEach((x,n)=>{if(x.id===CDRAG.id)i=n;if(x.id===c.dataset.id)j=n;});
  if(i<0||j<0)return;
  a.splice(j,0,a.splice(i,1)[0]);
  save();cardsPaint();
}
function cUp(){
  if(CDRAG&&CDRAG.on){noClick=true;setTimeout(function(){noClick=false;},350);}
  const moved=!!(CDRAG&&CDRAG.on);
  cEnd();
  if(moved)render();
}
function cEnd(){
  if(CDRAG&&CDRAG.t)clearTimeout(CDRAG.t);
  CDRAG=null;
  document.removeEventListener("pointermove",cMove);
  document.removeEventListener("pointerup",cUp);
  document.removeEventListener("pointercancel",cUp);
  document.removeEventListener("touchmove",cBlock);
  const g=document.querySelector(".grid,.pjlist");if(g)g.classList.remove("reorder");
  const d=document.querySelector(".card.dragging,.pj.dragging");if(d)d.classList.remove("dragging");
}
