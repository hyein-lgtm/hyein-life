<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Life OS">
<meta name="description" content="프로젝트·업무·독서·운동·브랜드·부동산을 한 곳에서 관리하는 개인 대시보드">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>My Life OS — hyein</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#eef3fb; --card:#ffffff; --ink:#0f1b33; --muted:#6b7c99; --line:#e6ecf7;
  --blue:#2563eb; --blue-d:#1d4ed8; --blue-l:#dbe8ff; --blue-xl:#f4f8ff;
  --navy:#0d1f42; --ok:#0ea472; --warn:#d97706; --danger:#e11d48;
  --r:16px; --sh:0 1px 2px rgba(15,27,51,.05), 0 8px 24px rgba(15,27,51,.05);
}
*{box-sizing:border-box}
body{
  margin:0;padding:28px 18px 48px;color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:14px;line-height:1.55;letter-spacing:-.01em;
  background:
    radial-gradient(900px 420px at 12% -8%, #dbe8ff 0%, transparent 60%),
    radial-gradient(700px 380px at 92% 0%, #e4f0ff 0%, transparent 55%),
    var(--bg);
  min-height:100vh;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;color:var(--ink)}
a{color:var(--blue)}
.app{max-width:1140px;margin:0 auto;background:var(--card);border-radius:22px;
  box-shadow:0 2px 4px rgba(13,31,66,.04),0 24px 60px rgba(13,31,66,.10);overflow:hidden}
/* topbar */
.topbar{display:flex;align-items:center;gap:14px;padding:18px 24px;
  background:linear-gradient(120deg,var(--navy) 0%,#173a77 45%,#2563eb 100%);color:#fff}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.16);font-size:17px}
.brand h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em}
.brand p{margin:1px 0 0;font-size:11.5px;opacity:.72}
.topmeta{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;
  background:rgba(255,255,255,.12);padding:7px 14px;border-radius:999px}
.topmeta .dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.55)}
/* hero */
.hero{padding:26px 24px 4px}
.hero h2{margin:0 0 6px;font-size:24px;font-weight:800;letter-spacing:-.03em}
.hero p{margin:0;color:var(--muted);font-size:13px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;padding:18px 24px 4px}
.stat{background:var(--blue-xl);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
  font-size:11.5px;color:var(--muted);font-weight:600}
.stat b{display:block;font-size:23px;font-weight:800;color:var(--ink);letter-spacing:-.03em;margin-top:2px}
/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:7px;padding:20px 24px 0}
.tab{border:1px solid var(--line);background:#fff;color:#5a6c8c;border-radius:999px;
  padding:9px 15px;font-size:13px;font-weight:600;transition:.15s}
.tab:hover{border-color:#bed3f7;color:var(--blue)}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.26)}
/* board */
.board{padding:18px 24px 28px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.btn{border:1px solid var(--line);background:#fff;color:#41546f;border-radius:11px;
  padding:9px 14px;font-size:13px;font-weight:600;transition:.15s}
.btn:hover{border-color:#bed3f7;background:var(--blue-xl);color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 18px rgba(37,99,235,.28)}
.btn.primary:hover{background:var(--blue-d);color:#fff}
.btn.danger{color:var(--danger);border-color:#fadbe4}
.btn.danger:hover{background:#fff5f7;border-color:#f5c2d0;color:var(--danger)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}
.spacer{flex:1}
.search{border:1px solid var(--line);border-radius:11px;padding:9px 13px;font-size:13px;width:210px;
  background:#fff;outline:none;transition:.15s}
.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:#fff;color:#69799a;border-radius:999px;
  padding:5px 12px;font-size:12px;font-weight:600;transition:.15s}
.chip:hover{border-color:#bed3f7;color:var(--blue)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
.grid.cal{grid-template-columns:repeat(auto-fill,minmax(304px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  display:flex;flex-direction:column;overflow:hidden;transition:.18s}
.card:hover{border-color:#c9dcfa;box-shadow:0 4px 10px rgba(15,27,51,.06),0 16px 34px rgba(15,27,51,.10);transform:translateY(-2px)}
.card .head{display:flex;align-items:center;gap:8px;padding:13px 15px 0;font-size:11.5px;font-weight:700;color:var(--blue)}
.card .head .t{background:var(--blue-l);padding:3px 9px;border-radius:999px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.card .head .acts{margin-left:auto;display:flex;gap:4px;opacity:.35;transition:.15s}
.card:hover .head .acts{opacity:1}
.card .head .acts button{width:24px;height:24px;border-radius:8px;border:1px solid var(--line);
  background:#fff;color:#8394b3;font-size:11px;line-height:1;padding:0}
.card .head .acts button:hover{border-color:#bed3f7;color:var(--blue);background:var(--blue-xl)}
.card .body{padding:10px 15px 15px;display:flex;flex-direction:column;gap:10px;flex:1}
.card h3{margin:0;font-size:15.5px;font-weight:700;letter-spacing:-.02em;line-height:1.4}
.card h3.clickable{cursor:pointer;transition:.15s}
.card h3.clickable:hover{color:var(--blue)}
.meta{display:flex;flex-wrap:wrap;gap:5px;font-size:11px}
.pill{background:#f2f6fc;color:#5b6d8c;border-radius:999px;padding:3px 9px;font-weight:600}
.pill.st-todo{background:#eef2f8;color:#6b7c99}
.pill.st-doing{background:var(--blue-l);color:var(--blue-d)}
.pill.st-done{background:#d8f5ea;color:var(--ok)}
.pill.st-hold{background:#fdeccd;color:var(--warn)}
.note{font-size:12.5px;color:var(--muted);line-height:1.65;white-space:pre-wrap}
.bar{height:20px;border-radius:999px;background:#eef2f9;position:relative;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#60a5fa,#2563eb);transition:width .25s}
.bar>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;
  padding-right:10px;font-size:10.5px;font-weight:700}
.bar>span{color:#41546f}
.card a.link{font-size:12px;font-weight:600}
/* calendar */
.monthnav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.monthnav .m{font-size:15px;font-weight:800;letter-spacing:-.02em;min-width:96px;text-align:center}
.cal-wrap{background:var(--blue-xl);border:1px solid var(--line);border-radius:13px;padding:9px}
.cal-head,.cal-body{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-head div{text-align:center;font-size:10px;font-weight:700;color:#9aabc6;padding:2px 0 4px}
.cal-head div.sat{color:#4f7ddb}.cal-head div.sun{color:#e0648a}
.cal-body button{height:29px;border:none;border-radius:9px;background:#fff;color:#a3b2ca;
  font-size:11px;font-weight:600;padding:0;display:flex;align-items:center;justify-content:center;transition:.13s}
.cal-body button:hover{background:var(--blue-l);color:var(--blue-d)}
.cal-body button.on{background:var(--blue);color:#fff;box-shadow:0 3px 8px rgba(37,99,235,.3)}
.cal-body button.today{box-shadow:inset 0 0 0 2px var(--blue);color:var(--blue)}
.cal-body button.on.today{box-shadow:inset 0 0 0 2px #fff,0 3px 8px rgba(37,99,235,.35);color:#fff}
.cal-body button:disabled{background:transparent;cursor:default}
.legend{font-size:11.5px;color:#9aabc6;text-align:center;margin-top:14px}
/* --- 운동 통합 캘린더 --- */
.calbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.cal-body.big{gap:6px}
.dcell{min-height:78px;border:1px solid var(--line);border-radius:12px;background:#fbfcff;
  padding:6px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.dcell:hover{background:var(--blue-xl);border-color:var(--blue-l);transform:translateY(-1px)}
.dcell.off{background:transparent;border-color:transparent;cursor:default}
.dcell.off:hover{transform:none;background:transparent}
.dcell.has{background:#fff;border-color:var(--blue-l)}
.dcell.today{box-shadow:inset 0 0 0 2px var(--blue)}
.dnum{font-size:11.5px;font-weight:800;color:#9aabc6}
.dcell.has .dnum{color:var(--blue-d)}
.dtags{display:flex;flex-direction:column;gap:3px}
.dtag{font-size:9.5px;font-weight:700;padding:2px 5px;border-radius:6px;border:1px solid;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.dmore{font-size:9.5px;color:#9aabc6;font-weight:700;padding-left:3px}
.tsums{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tsum{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#41546f;
  background:var(--blue-xl);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
.tsum i,.chip.tchip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip.tchip{display:inline-flex;align-items:center;gap:6px}
/* --- 날짜 기록 모달 / 종류 관리 --- */
.elist{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.erow{display:flex;align-items:center;gap:9px;background:var(--blue-xl);border:1px solid var(--line);
  border-radius:11px;padding:9px 11px;font-size:13px}
.erow b{font-weight:700;color:var(--ink)}
.erow .dot{width:9px;height:9px;border-radius:50%;flex:none}
.erow .emin{margin-left:auto;color:var(--muted);font-size:12px;font-weight:600}
.erow .tcol{width:34px;height:26px;padding:0;border:1px solid var(--line);border-radius:7px;background:#fff;flex:none}
.erow .tname{flex:1;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit;font-size:13px;background:#fff}
.erow .x{margin-left:auto;border:none;background:transparent;color:#b9c5d8;cursor:pointer;font-size:13px;flex:none}
.erow .tname+.x{margin-left:0}
.erow .x:hover{color:var(--danger)}
.ehint{font-size:12.5px;color:var(--muted);text-align:center;padding:16px 0;
  background:var(--blue-xl);border:1px dashed var(--line);border-radius:11px}
.btn.wide{width:100%;justify-content:center;margin-top:4px}
textarea.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;min-height:96px;
  line-height:1.5;word-break:break-all;color:#5b6d8c}
/* --- 문장 수집 --- */
.qrow{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
.qpage{flex:none;font-size:11px;font-weight:800;color:var(--blue-d);background:var(--blue-l);
  border-radius:6px;padding:3px 7px;margin-top:1px}
.qtext{flex:1;font-size:13px;line-height:1.65;color:var(--ink)}
.qrow .x{border:none;background:transparent;color:#b9c5d8;cursor:pointer}
.qrow .x:hover{color:var(--danger)}
.addline input.pg{flex:none;width:64px}
@media(max-width:640px){.dcell{min-height:60px}.dtag{font-size:8.5px}}

.empty{padding:56px 12px;text-align:center;color:#9aabc6;font-size:13px;line-height:1.9;
  border:1px dashed var(--line);border-radius:var(--r)}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(9,20,42,.42);backdrop-filter:blur(5px);
  display:none;align-items:flex-start;justify-content:center;padding:36px 16px;z-index:50;overflow:auto}
.overlay.on{display:flex}
.modal{width:100%;max-width:460px;background:#fff;border-radius:20px;overflow:hidden;
  box-shadow:0 30px 70px rgba(9,20,42,.32);animation:pop .18s ease-out}
.modal.wide{max-width:760px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.mhead{display:flex;align-items:center;gap:10px;padding:17px 20px;border-bottom:1px solid var(--line)}
.mhead .ic{width:32px;height:32px;border-radius:10px;background:var(--blue-l);color:var(--blue-d);
  display:flex;align-items:center;justify-content:center;font-size:15px}
.mhead b{font-size:15px;font-weight:800;letter-spacing:-.02em}
.mhead .close{margin-left:auto;width:32px;height:32px;border-radius:10px;border:1px solid var(--line);
  background:#fff;color:#8394b3;font-size:14px;line-height:1}
.mhead .close:hover{background:#fff5f7;border-color:#f5c2d0;color:var(--danger)}
.crumb{padding:11px 20px;background:var(--blue-xl);border-bottom:1px solid var(--line);
  font-size:11.5px;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.form{padding:18px 20px;display:flex;flex-direction:column;gap:13px;max-height:70vh;overflow:auto}
.foot{display:flex;gap:8px;align-items:center;padding:14px 20px;border-top:1px solid var(--line);background:#fbfdff}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{font-size:13.5px;padding:10px 12px;border:1px solid var(--line);
  border-radius:11px;background:#fff;outline:none;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
.field textarea{min-height:76px;resize:vertical;line-height:1.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.sect{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fbfdff}
.sect>h4{margin:0 0 10px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px}
.sect>h4 .r{margin-left:auto;font-size:11px;font-weight:600;color:var(--muted)}
.row{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;padding:8px 0;border-bottom:1px solid #eef2f9}
.row:last-of-type{border-bottom:none}
.row .grow{flex:1;line-height:1.55;word-break:break-word}
.row .grow.done{text-decoration:line-through;color:#a9b6cc}
.row .x{background:none;border:none;color:#c3cede;font-size:13px;padding:0 3px;transition:.15s}
.row .x:hover{color:var(--danger)}
.row input[type=checkbox]{width:17px;height:17px;margin:2px 0 0;accent-color:var(--blue)}
.addline{display:flex;gap:7px;margin-top:11px}
.addline input{flex:1;font-size:13px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
.addline input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
.addline input.dt{flex:0 0 132px}
.logdate{flex:0 0 78px;font-size:11.5px;font-weight:700;color:var(--blue);padding-top:2px}
.detail-title{width:100%;font-size:19px;font-weight:800;letter-spacing:-.03em;padding:11px 13px;
  border:1px solid var(--line);border-radius:12px;outline:none}
.detail-title:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
/* --- 브랜드(인플루언서) 탭 --- */
.goalpanel{background:linear-gradient(120deg,#f7f4ee,#eef4ff);border:1px solid #e8e3d8;
  border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
.ghead{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:800;
  letter-spacing:-.02em;color:#3c4a63;margin-bottom:13px}
.ghead .btn{margin-left:auto}
.ggrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:13px}
.gcell{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.9);
  border-radius:12px;padding:11px 13px}
.glab{font-size:11px;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:3px}
.glab b{font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.glab b span{font-size:11px;font-weight:600;color:#9aabc6}
.bar.sm{height:7px;margin-top:8px}
.gpct{font-size:10.5px;color:var(--blue-d);font-weight:800;text-align:right;margin-top:4px}
.gsum{font-size:11.5px;color:#6b7c99;margin-top:12px;padding-top:11px;border-top:1px dashed #e2ddd0}
.sechead{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;
  letter-spacing:-.02em;color:#3c4a63;margin:20px 0 12px}
.sechead span{font-size:11.5px;font-weight:600;color:var(--muted)}
.dtag.mtag{cursor:pointer;background:var(--blue-l);color:var(--blue-d);border-color:#c9dcfb;
  font-weight:700;max-width:100%}
.dtag.mtag.st-done{background:#d8f5ea;color:#0b7f59;border-color:#a9e6cf}
.dtag.mtag.st-doing{background:#dbe8ff;color:var(--blue-d);border-color:#bcd4fb}
.dtag.mtag.st-hold{background:#fdeccd;color:#a16207;border-color:#f4d79b}
.dtag.mtag.st-todo{background:#eef2f8;color:#64748b;border-color:#dfe6f0}
.dtag.mtag:hover{filter:brightness(.96)}
.hookline{font-size:12.5px;line-height:1.6;color:#4a5a75;background:#faf7f0;
  border-left:3px solid #e0d6bf;border-radius:0 9px 9px 0;padding:8px 11px}
.perf{display:flex;flex-wrap:wrap;gap:6px}
.perf span{font-size:11px;font-weight:700;color:#5b6d8c;background:#f4f7fc;
  border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.sect.plan{background:#faf8f3;border-color:#ece5d6}
.sect.perf{background:#f5f9ff;border-color:#dfe9fa}
.sect .field{margin-top:11px}
.sect textarea.tags{min-height:56px;color:var(--blue-d);font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px}
@media(max-width:660px){.ggrid{grid-template-columns:1fr 1fr}.pgrid{grid-template-columns:1fr 1fr}}
/* --- 데일리 투두 --- */
.weekbar{display:flex;align-items:center;gap:6px;margin-bottom:14px}
.wnav{border:1px solid var(--line);background:#fff;color:#8496b5;border-radius:10px;
  width:30px;height:52px;flex:none;cursor:pointer;font-size:16px;font-weight:700}
.wnav:hover{border-color:#bed3f7;color:var(--blue);background:var(--blue-xl)}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;flex:1;min-width:0}
.wday{position:relative;border:1px solid var(--line);background:#fff;border-radius:13px;
  padding:6px 2px 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;transition:.15s}
.wday:hover{border-color:#bed3f7;background:var(--blue-xl)}
.wday .wdw{font-size:10px;font-weight:700;color:#9aabc6}
.wday.sat .wdw{color:#4f7ddb}.wday.sun .wdw{color:#e0648a}
.wday .wdn{font-size:15px;font-weight:800;color:#41546f;line-height:1.15}
.wday.td .wdn{color:var(--blue)}
.wday.sel{background:var(--blue);border-color:var(--blue);box-shadow:0 6px 16px rgba(37,99,235,.26)}
.wday.sel .wdw,.wday.sel .wdn{color:#fff}
.wring{width:16px;height:16px;border-radius:50%;margin-top:1px;
  background:conic-gradient(var(--blue) calc(var(--p)*1%),#e9eff9 0)}
.wring.full{background:var(--ok)}
.wday.sel .wring{background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.32) 0)}

function load(){
  try{const raw=localStorage.getItem(KEY)||localStorage.getItem("hyein_work_os_v2");
    if(raw) return normalize(JSON.parse(raw));}catch(e){}
  return normalize(JSON.parse(JSON.stringify(SEED)));
}
function normalize(d){
  const ord=Array.isArray(d.__order)?d.__order:null;
  const m={};                       // SEED 순서 유지 + 새로 생긴 탭 자동 추가
  Object.keys(SEED).forEach(k=>{ m[k]= d[k] || JSON.parse(JSON.stringify(SEED[k])); });
  Object.keys(d).forEach(k=>{ if(k.indexOf("__")!==0 && !m[k]) m[k]=d[k]; });
  d=m;
  Object.keys(d).forEach(k=>{
    const s=d[k];
    if(s.type==="muse"&&!s.account){ d[k]=JSON.parse(JSON.stringify(SEED.muse)); return; }
    if(s.type==="muse"){
      const fw=(FEED.muse&&FEED.muse.week)||null;
      if(fw&&fw.start&&(!s.week||!s.week.start||fw.start>s.week.start)) s.week=JSON.parse(JSON.stringify(fw));
      s.followers=s.followers||{cur:0,goal:1000};
      s.history=Array.isArray(s.history)?s.history:[{d:todayStr(),n:s.followers.cur}];
    }
    if(s.type==="daily"){
      s.cats=(s.cats&&s.cats.length)?s.cats:JSON.parse(JSON.stringify(SEED.daily.cats));
      s.days=s.days||{};
      Object.keys(s.days).forEach(dk=>{ s.days[dk]=(s.days[dk]||[]).map(t=>({id:t.id||("d"+Math.random().toString(36).slice(2,8)),cat:t.cat,part:(t.part==="pm"?"pm":"am"),text:t.text||"",done:!!t.done})); });
      s.items=[];
    }
    if(s.type==="habit"){
      s.types=(s.types&&s.types.length)?s.types:JSON.parse(JSON.stringify(SEED.habit.types));
      s.entries=s.entries||{};
      s.goalCount=+s.goalCount||20;
      s.goalMin=+s.goalMin||0;
      (s.items||[]).forEach(it=>{
        const t=s.types[0];
        Object.keys(it.done||{}).forEach(day=>{
          s.entries[day]=s.entries[day]||[];
          s.entries[day].push({id:uid(),type:t.id,min:0,memo:it.title||""});
        });
      });
      s.items=[];
      return;
    }
    if(s.type==="muse"){
      s.followers=s.followers||{cur:0,goal:10000};
      s.followers.cur=+s.followers.cur||0; s.followers.goal=+s.followers.goal||10000;
      s.monthGoal=s.monthGoal||{}; 
      s.monthGoal.uploads=+s.monthGoal.uploads||8;
      s.monthGoal.views=+s.monthGoal.views||100000;
      s.monthGoal.saves=+s.monthGoal.saves||1000;
      (s.items||[]).forEach(i=>{
        i.hook=i.hook||""; i.concept=i.concept||""; i.cta=i.cta||""; i.hashtags=i.hashtags||"";
        const st=i.stats||{};
        i.stats={views:+st.views||0,likes:+st.likes||0,comments:+st.comments||0,saves:+st.saves||0,shares:+st.shares||0,follows:+st.follows||0};
        if(MSTATUS.indexOf(i.status)<0) i.status="아이디어";
      });
    }
    s.items=(s.items||[]).map(i=>{
      i.todos=i.todos||[]; i.milestones=i.milestones||[]; i.logs=i.logs||[]; i.quotes=i.quotes||[];
      i.links=i.links||(i.link?[{label:"링크",url:i.link}]:[]);
      i.goal=i.goal||""; i.desc=i.desc||""; i.owner=i.owner||""; i.start=i.start||"";
      i.status=i.status||"할일"; i.progress=+i.progress||0; i.due=i.due||""; i.note=i.note||"";
      delete i.link;
      return i;
    });
  });
  const keys=Object.keys(d);
  d.__order=(ord||[]).filter(k=>keys.indexOf(k)>=0)
    .concat(keys.filter(k=>!ord||ord.indexOf(k)<0));
  return d;
}

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function uid(){return "x"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function stClass(s){
  if(s==="완료"||s==="발행")return "st-done";
  if(s==="진행중"||s==="촬영"||s==="편집")return "st-doing";
  if(s==="대기"||s==="예약")return "st-hold";
  return "st-todo";
}
function todayStr(){const d=new Date();return ymd(d);}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dday(d){
  if(!d) return "";
  const t=new Date(d+"T00:00:00"),n=new Date();n.setHours(0,0,0,0);
  const diff=Math.round((t-n)/86400000);
  return diff===0?"D-DAY":diff>0?("D-"+diff):("D+"+(-diff));
}

function monthStats(y,m){
  const s=hs();let days=0,cnt=0,min=0,per={};
  (s.types||[]).forEach(t=>per[t.id]={c:0,m:0});
  for(let d=1;d<=monthDays(y,m);d++){
    const es=dEnt(dayKey(y,m,d));
    if(es.length)days++;
    es.forEach(e=>{cnt++;min+=+e.min||0;if(per[e.type]){per[e.type].c++;per[e.type].m+=+e.min||0;}});
  }
  return {days:days,cnt:cnt,min:min,per:per};
}
function hhmm(m){m=+m||0;return m>=60?(Math.floor(m/60)+"시간 "+(m%60?m%60+"분":"")).trim():m+"분";}
function streakDays(){
  const s=hs();const has=x=>((s.entries[ymd(x)]||[]).length>0);
  let n=0,d=new Date();d.setHours(0,0,0,0);
  if(!has(d))d.setDate(d.getDate()-1);
  while(has(d)){n++;d.setDate(d.getDate()-1);}
  return n;
}

  if(o&&o.length) return o.filter(k=>DATA[k]);

}
function setOrder(a){DATA.__order=a;save();renderTabs();}
function moveTab(k,dir){

/* 길게 눌러 끌기 */
let DRAG=null;
function tabDown(ev,k){
  if(DRAG)return;
  DRAG={k:k,sx:ev.clientX,sy:ev.clientY,on:false,touch:ev.pointerType!=="mouse",t:null};
  DRAG.t=DRAG.touch?setTimeout(startDrag,260):null;   // 마우스는 6px 이동해야 시작
  document.addEventListener("pointermove",dragMove);
  document.addEventListener("pointerup",dragUp);
  document.addEventListener("pointercancel",dragUp);
  document.addEventListener("touchmove",blockScroll,{passive:false});
}
function startDrag(){
  if(!DRAG||DRAG.on)return;
  DRAG.on=true;
  const el=document.querySelector('.tab[data-k="'+DRAG.k+'"]');
  if(el)el.classList.add("dragging");
  document.getElementById("tabs").classList.add("reorder");
  if(navigator.vibrate)try{navigator.vibrate(12);}catch(e){}
}
function blockScroll(ev){if(DRAG&&DRAG.on&&ev.cancelable)ev.preventDefault();}
function dragMove(ev){
  if(!DRAG)return;
  if(!DRAG.on){
    const dist=Math.abs(ev.clientX-DRAG.sx)+Math.abs(ev.clientY-DRAG.sy);
    if(DRAG.touch){ if(dist>10){clearTimeout(DRAG.t);endDrag();} return; }
    if(dist>6) startDrag(); else return;
  }
  if(!document.elementFromPoint)return;
  const el=document.elementFromPoint(ev.clientX,ev.clientY);
  const tab=el&&el.closest?el.closest(".tab"):null;
  if(!tab||!tab.dataset.k||tab.dataset.k===DRAG.k)return;
  const a=tabKeys(),i=a.indexOf(DRAG.k),j=a.indexOf(tab.dataset.k);
  if(i<0||j<0)return;
  a.splice(j,0,a.splice(i,1)[0]);
  DATA.__order=a;save();renderTabs();
  const nw=document.querySelector('.tab[data-k="'+DRAG.k+'"]');
  if(nw)nw.classList.add("dragging");
  document.getElementById("tabs").classList.add("reorder");
}
function dragUp(){ if(DRAG&&DRAG.on){noClick=true;setTimeout(()=>{noClick=false;},350);} endDrag(); }
function endDrag(){
  if(DRAG&&DRAG.t)clearTimeout(DRAG.t);
  document.removeEventListener("pointermove",dragMove);
  document.removeEventListener("pointerup",dragUp);
  document.removeEventListener("pointercancel",dragUp);
  document.removeEventListener("touchmove",blockScroll);
  const wasOn=DRAG&&DRAG.on;DRAG=null;
  const t=document.getElementById("tabs");
  if(t){t.classList.remove("reorder");[...t.querySelectorAll(".dragging")].forEach(x=>x.classList.remove("dragging"));}
  if(wasOn)setTimeout(()=>{},0);
}

function ds(){return DATA.daily;}
function catOf(id){const s=ds();return (s.cats||[]).find(c=>c.id===id)||{id:id,name:"기타",color:"#94a3b8"};}
function dayTodos(k){return (ds().days||{})[k]||[];}
function dayRate(k){
  const t=dayTodos(k);if(!t.length)return -1;
  return Math.round(t.filter(x=>x.done).length/t.length*100);
}
function addDays(k,n){const d=new Date(k+"T00:00:00");d.setDate(d.getDate()+n);return ymd(d);}
function weekStart(k){const d=new Date(k+"T00:00:00");const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ymd(d);}
function korDate(k){const d=new Date(k+"T00:00:00");
  return (d.getMonth()+1)+"월 "+d.getDate()+"일 ("+WD[(d.getDay()+6)%7]+")";}
function weekStrip(){
  const st=weekStart(daySel),t=todayStr();
  let out="";
  for(let i=0;i<7;i++){
    const k=addDays(st,i),r=dayRate(k),n=new Date(k+"T00:00:00").getDate();
    const cls=(k===daySel?"sel ":"")+(k===t?"td ":"")+(i===5?"sat ":i===6?"sun ":"");
    const ring=r<0?"":`<span class="wring ${r===100?"full":""}" style="--p:${r}"></span>`;
    out+=`<button class="wday ${cls}" onclick="setDay('${k}')">
      <span class="wdw">${WD[i]}</span><span class="wdn">${n}</span>${ring}</button>`;
  }
  return `<div class="weekbar">
    <button class="wnav" onclick="setDay('${addDays(daySel,-7)}')">‹</button>
    <div class="weekstrip">${out}</div>
    <button class="wnav" onclick="setDay('${addDays(daySel,7)}')">›</button></div>`;
}
function setDay(k){daySel=k;const d=new Date(k+"T00:00:00");calY=d.getFullYear();calM=d.getMonth();render();}

function dailyList(){

function addDaily(cid,part){
  const eid="a_"+cid+(part==="pm"?"_pm":"");
  const el=document.getElementById(eid); if(!el) return;
  const v=(el.value||"").trim(); if(!v) return;
  el.value="";
  const s=ds(); if(!s.days) s.days={};
  if(!s.days[daySel]) s.days[daySel]=[];
  s.days[daySel].push({id:uid(),cat:cid,part:(part==="pm"?"pm":"am"),text:v,done:false});
  render();
  const n=document.getElementById(eid); if(n) n.focus();
}
function movePart(id){
  const t=dayTodos(daySel).find(x=>x.id===id); if(!t) return;
  t.part=(t.part==="pm")?"am":"pm"; render();
}
function togDaily(id){
  const t=dayTodos(daySel).find(x=>x.id===id); if(!t) return;
  t.done=!t.done; render();
}
function delDaily(id){
  const s=ds(); s.days[daySel]=dayTodos(daySel).filter(x=>x.id!==id); render();
}
function copyYesterday(){
  const y=addDays(daySel,-1),src=dayTodos(y); if(!src.length) return;
  const s=ds(); if(!s.days) s.days={}; if(!s.days[daySel]) s.days[daySel]=[];
  const have=dayTodos(daySel).map(x=>x.text);
  src.forEach(x=>{ if(have.indexOf(x.text)<0) s.days[daySel].push({id:uid(),cat:x.cat,part:(x.part==="pm"?"pm":"am"),text:x.text,done:false}); });
  render();
}

function statusList(){return DATA[cur]&&DATA[cur].type==="muse"?MSTATUS:STATUSES;}
function ms(){return DATA.muse;}
function nfm(n){n=+n||0;return n>=10000?(n/10000).toFixed(n%10000?1:0).replace(/\.0$/,"")+"만":n.toLocaleString("ko-KR");}
function inMonth(d){return d&&d.slice(0,7)===calY+"-"+String(calM+1).padStart(2,"0");}
function museAgg(){
  const s=ms();let v=0,l=0,sv=0,sh=0,fo=0,cm=0,upM=0,pub=0;
  (s.items||[]).forEach(i=>{
    const st=i.stats||{};
    v+=+st.views||0;l+=+st.likes||0;sv+=+st.saves||0;sh+=+st.shares||0;
    fo+=+st.follows||0;cm+=+st.comments||0;
    if(i.status==="발행")pub++;
    if(inMonth(i.due))upM++;
  });
  return {views:v,likes:l,saves:sv,shares:sh,follows:fo,comments:cm,upM:upM,pub:pub};
}
function goalBar(label,cur,goal,unit){
  const pct=goal?Math.min(100,Math.round(cur/goal*100)):0;
  return `<div class="gcell"><div class="glab">${label}<b>${nfm(cur)} <span>/ ${nfm(goal)}${unit||""}</span></b></div>
    <div class="bar sm"><i style="width:${pct}%"></i></div><div class="gpct">${pct}%</div></div>`;
}
function spark(h){
  h=(h||[]).slice(-12); if(h.length<2) return "";
  const ns=h.map(x=>+x.n||0),mx=Math.max.apply(null,ns),mn=Math.min.apply(null,ns);
  const rg=(mx-mn)||1,W=132,H=30;
  const pts=ns.map((n,i)=>[(i/(ns.length-1))*W,H-((n-mn)/rg)*(H-4)-2]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const diff=ns[ns.length-1]-ns[0];
  return `<div class="fspark"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${d}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="2.6" fill="var(--blue)"/></svg>
    <span class="${diff>=0?"up":"dn"}">${diff>=0?"▲":"▼"} ${Math.abs(diff)}명</span></div>`;
}

function setGoalV(k,v){
  const s=ms(),n=Math.max(0,+v||0);
  if(k==="fcur"){s.followers.cur=n;
    s.history=s.history||[];
    const t=todayStr(),last=s.history[s.history.length-1];
    if(last&&last.d===t)last.n=n; else s.history.push({d:t,n:n});
    if(s.history.length>60)s.history=s.history.slice(-60);
  } else if(k==="fgoal")s.followers.goal=Math.max(1,n);
  else if(k==="up")s.monthGoal.uploads=Math.max(1,n); else if(k==="vw")s.monthGoal.views=Math.max(1,n);
  else if(k==="sv")s.monthGoal.saves=Math.max(1,n);
  save();render();
}

function renderStats(){
  const s=DATA[cur],its=s.items;let cells;
  if(s.type==="habit"){
    const st=monthStats(calY,calM);
    cells=[[(calM+1)+"월 운동한 날",st.days+"일"],["총 횟수",st.cnt+"회"],["총 운동 시간",hhmm(st.min)],
           ["월 목표",st.cnt+" / "+s.goalCount+"회"],["지금 연속",streakDays()+"일"]];
  }else if(s.type==="daily"){
    const all=dayTodos(daySel),dn=all.filter(x=>x.done).length;
    const ws=weekStart(daySel);let wt=0,wd=0;

    const tot=monthDays(calY,calM);let md=0,mf=0;
    for(let d=1;d<=tot;d++){const r=dayRate(dayKey(calY,calM,d));if(r>=0){md++;if(r===100)mf++;}}
    let sk=0,c=todayStr();
    while(dayTodos(c).length){sk++;c=addDays(c,-1);}
    cells=[["선택한 날",dn+" / "+all.length],["이번 주",(wt?Math.round(wd/wt*100):0)+"%"],
           [(calM+1)+"월 기록",md+"일"],["100% 달성",mf+"일"],["연속 기록",sk+"일"]];
  }else if(s.type==="muse"){
    const a=museAgg(),f=s.followers;

    const idea=its.filter(i=>i.status==="아이디어"||i.status==="기획").length;

           ["누적 조회수",nfm(a.views)],["누적 저장수",nfm(a.saves)],["기획 중",idea+"개"]];
  }else{
    const done=its.filter(i=>i.status==="완료").length;

    <div class="field"><label>메모</label><input id="f_ememo" placeholder="예: 하체 위주 / 러닝 5km" onkeydown="if(event.key==='Enter'){event.preventDefault();addEntry()}"></div>
    <button class="btn primary wide" onclick="addEntry()">＋ 기록 추가</button>`;
  document.getElementById("mIc").innerHTML=chImg("habit");
  document.getElementById("mSave").style.display="none";
  document.getElementById("overlay").classList.add("on");
}
function addEntry(){
  const s=hs(),k=dayCur;if(!k)return;
  s.entries[k]=s.entries[k]||[];
  const mm=document.getElementById("f_ememo");
  s.entries[k].push({id:uid(),type:document.getElementById("f_etype").value,min:Math.max(0,+document.getElementById("f_emin").value||0),memo:((mm&&mm.value)||"").trim()});
  save();openDay(k);render();
}
function delEntry(id){
  const s=hs(),k=dayCur;if(!k)return;
  s.entries[k]=(s.entries[k]||[]).filter(e=>e.id!==id);
  if(!s.entries[k].length) delete s.entries[k];
  save();openDay(k);render();
}
function openTypes(){
  const s=hs();
  document.getElementById("mTitle").textContent="⚙ 운동 종류 관리";
  const rows=(s.types||[]).map(t=>`<div class="erow">
    <input class="tcol" type="color" value="${t.color}" onchange="setTypeColor('${t.id}',this.value)">
    <input class="tname" value="${esc(t.name)}" onchange="setTypeName('${t.id}',this.value)">
    <button class="x" onclick="delType('${t.id}')">✕</button></div>`).join("");
  document.getElementById("mForm").innerHTML=`<div class="elist">${rows}</div>
    <div class="two">
      <div class="field"><label>새 종류 이름</label><input id="f_tname" placeholder="예: 필라테스"></div>
      <div class="field"><label>색</label><input id="f_tcolor" type="color" value="#2563eb"></div>
    </div>
    <button class="btn primary wide" onclick="addType()">＋ 종류 추가</button>
    <div class="field" style="margin-top:12px"><label>이번 달 목표 횟수</label>
      <input type="number" min="1" value="${s.goalCount}" onchange="setGoal(this.value)"></div>`;
  document.getElementById("mIc").innerHTML=chImg("habit");
  document.getElementById("mSave").style.display="none";
  document.getElementById("overlay").classList.add("on");
}
function setGoal(v){hs().goalCount=Math.max(1,+v||20);save();render();}
function addType(){
  const n=(document.getElementById("f_tname").value||"").trim();
  if(!n){alert("이름을 입력해주세요.");return;}
  hs().types.push({id:uid(),name:n,color:document.getElementById("f_tcolor").value});
  save();openTypes();render();
}
function setTypeName(id,v){const t=typeOf(id);t.name=(v||"").trim()||t.name;save();render();}
function setTypeColor(id,v){typeOf(id).color=v;save();render();}
function delType(id){
  const s=hs();
  if((s.types||[]).length<=1){alert("최소 1개의 종류는 필요해요.");return;}
  if(!confirm("이 종류의 기록도 함께 삭제됩니다. 진행할까요?"))return;
  s.types=s.types.filter(t=>t.id!==id);
  Object.keys(s.entries).forEach(k=>{
    s.entries[k]=s.entries[k].filter(e=>e.type!==id);
    if(!s.entries[k].length) delete s.entries[k];});
  if(filter===id) filter="ALL";
  save();openTypes();render();
}

/* ---- 카드 순서 드래그 ---- */
let CDRAG=null;
function cardsArr(){return (DATA[cur]&&DATA[cur].items)||[];}
function cardDown(ev,id,now){
  if(CDRAG)return;
  if(!now){
    const t=ev.target;
    if(t&&t.closest&&t.closest("button,a,input,textarea,select,label"))return;
  }
  CDRAG={id:id,sx:ev.clientX,sy:ev.clientY,on:false,touch:ev.pointerType!=="mouse",t:null};
  if(now){cStart();}
  else{CDRAG.t=CDRAG.touch?setTimeout(cStart,300):null;}
  document.addEventListener("pointermove",cMove);
  document.addEventListener("pointerup",cUp);
  document.addEventListener("pointercancel",cUp);
  document.addEventListener("touchmove",cBlock,{passive:false});
}
function cStart(){
  if(!CDRAG)return;
  CDRAG.on=true;
  const g=document.querySelector(".grid");if(g)g.classList.add("reorder");
  const el=document.querySelector('.card[data-id="'+CDRAG.id+'"]');if(el)el.classList.add("dragging");
  if(navigator.vibrate){try{navigator.vibrate(12);}catch(e){}}
}
function cBlock(ev){if(CDRAG&&CDRAG.on&&ev.cancelable)ev.preventDefault();}
function cardsPaint(){
  const g=document.querySelector(".grid");if(!g)return;
  const mk=DATA[cur].type==="muse"?museCard:taskCard;
  g.innerHTML=visible().map(mk).join("");
  g.classList.add("reorder");
  if(CDRAG){const nw=g.querySelector('.card[data-id="'+CDRAG.id+'"]');if(nw)nw.classList.add("dragging");}
}
function cMove(ev){
  if(!CDRAG)return;
  if(!CDRAG.on){
    const d=Math.abs(ev.clientX-CDRAG.sx)+Math.abs(ev.clientY-CDRAG.sy);
    if(CDRAG.touch){if(d>10){clearTimeout(CDRAG.t);cEnd();}return;}
    if(d>6){cStart();}else{return;}
  }
  if(!document.elementFromPoint)return;
  const el=document.elementFromPoint(ev.clientX,ev.clientY);
  const c=el&&el.closest?el.closest(".card"):null;
  if(!c||!c.dataset.id||c.dataset.id===CDRAG.id)return;
  const a=cardsArr();
  let i=-1,j=-1;
  a.forEach((x,n)=>{if(x.id===CDRAG.id)i=n;if(x.id===c.dataset.id)j=n;});
  if(i<0||j<0)return;
  a.splice(j,0,a.splice(i,1)[0]);
  save();cardsPaint();
}
function cUp(){
  if(CDRAG&&CDRAG.on){noClick=true;setTimeout(function(){noClick=false;},350);}
  const moved=!!(CDRAG&&CDRAG.on);
  cEnd();
  if(moved)render();
}
function cEnd(){
  if(CDRAG&&CDRAG.t)clearTimeout(CDRAG.t);
  CDRAG=null;
  document.removeEventListener("pointermove",cMove);
  document.removeEventListener("pointerup",cUp);
  document.removeEventListener("pointercancel",cUp);
  document.removeEventListener("touchmove",cBlock);
  const g=document.querySelector(".grid");if(g)g.classList.remove("reorder");
  const d=document.querySelector(".card.dragging");if(d)d.classList.remove("dragging");
}

function FEEDGET(p,d){try{return p.split(".").reduce((a,k)=>a[k],FEED);}catch(e){return d;}}
function esDay(){return eStudyD||todayStr();}
function eIdx(k){
  const b=Date.UTC(2026,6,27),d=Date.parse(k+"T00:00:00Z");
  const n=Math.round((d-b)/86400000);
  return ((n%CURRI.length)+CURRI.length)%CURRI.length;
}
function eStudy(k){
  const f=FEEDGET("estate."+k+".study",null);
  return f||CURRI[eIdx(k)];
}
function eNews(k){return FEEDGET("estate."+k+".news",null)||[];}
function eRead(){const s=DATA.estate;s.read=s.read||{};return s.read;}
function togRead(){
  const k=esDay(),r=eRead();
  if(r[k])delete r[k];else r[k]=1;
  save();render();
}
function eStreak(){
  const r=eRead();let n=0,c=todayStr();
  while(r[c]){n++;c=addDays(c,-1);}
  return n;
}
function eShift(n){
  const k=addDays(esDay(),n);
  if(k>todayStr())return;
  eStudyD=k;render();
}
function studyToCard(){
  const k=esDay(),st=eStudy(k);
  const o={id:uid(),title:st.t,tag:"기초",status:"진행중",progress:0,due:"",owner:"",
    goal:(st.a||""),desc:(st.b||""),
    todos:(st.k||[]).map(x=>({id:uid(),text:x+" 뜻 내 말로 정리",done:false})),
    milestones:[],links:[],logs:[],quotes:[],note:"📚 "+k+" 오늘의 공부에서 저장"};
  DATA.estate.items.unshift(o);save();render();
}
function estatePanel(){
  const k=esDay(),st=eStudy(k),nw=eNews(k),r=eRead()[k],today=todayStr();
  const no=k===today?1:0;
  const terms=(st.k||[]).map(x=>`<span class="term">${esc(x)}</span>`).join("");
  const news=nw.length?nw.map(n=>`<div class="nitem">
      <div class="nt">${n.u?`<a href="${esc(n.u)}" target="_blank" rel="noopener">${esc(n.t)} ↗</a>`:esc(n.t)}</div>
      <div class="ns">${esc(n.s||"")}</div>
      ${n.w?`<div class="nw">💡 ${esc(n.w)}</div>`:""}</div>`).join("")
    :`<div class="nempty">아직 오늘 뉴스가 없어요. 매일 오전 9시에 클로드가 채워둡니다.</div>`;
  return `<div class="studybox">
    <div class="sbhead">
      <button class="btn sm" onclick="eShift(-1)">‹ 어제</button>

      <button class="btn sm" ${no?"disabled":""} onclick="eShift(1)">내일 ›</button>
      <span class="strk">🔥 ${eStreak()}일 연속</span>
    </div>
    <div class="sbmain">
      <div class="sblab">📚 오늘의 공부 · ${eIdx(k)+1}일차</div>
      <h3>${esc(st.t)}</h3>
      <p>${esc(st.b)}</p>
      ${terms?`<div class="terms">${terms}</div>`:""}
      ${st.a?`<div class="todoline">✅ 오늘의 한 가지 — ${esc(st.a)}</div>`:""}
      <div class="sbacts">
        <button class="btn sm ${r?"primary":""}" onclick="togRead()">${r?"✓ 읽음":"읽음 표시"}</button>
        <button class="btn sm ghost" onclick="studyToCard()">카드로 저장</button>
      </div>
    </div>
    <div class="sbnews"><div class="sblab">📰 오늘의 부동산 이슈</div>${news}</div>
  </div>`;

];
const WX=["캠핑","혼밥","산책","커피","독서","드라이브","정리","달리기"];
const WP=["강원도","서울 근교","동네","제주","바다 앞","숲속"];
function wkOf(k){const d=new Date(k+"T00:00:00");return Math.floor(d.getTime()/604800000);}
function genWeek(){
  const s=ms(),ws=weekStart(todayStr()),n=wkOf(ws);
  const ep=((s.items||[]).filter(i=>/EP\./.test(i.title)).length)+1;
  const slots=WPAT.map((p,i)=>{
    const pick=a=>a[(n+i)%a.length];
    const t=pick(p.t).replace("{n}",String(ep+i>9?ep:"0"+(ep))).replace("{x}",WX[(n+i)%WX.length]).replace("{p}",WP[(n+i*2)%WP.length]);
    return {id:uid(),d:addDays(ws,p.d),tag:p.tag,title:t,hook:pick(p.h),note:"",made:false};
  });
  s.week={start:ws,src:"auto",made:todayStr(),slots:slots};
  save();render();
}
function slotCard(id){
  const s=ms(),sl=(s.week&&s.week.slots||[]).find(x=>x.id===id); if(!sl)return;
  const o={id:uid(),title:sl.title,tag:sl.tag||(s.tags||[])[0]||"릴스",status:"기획",progress:0,
    start:todayStr(),due:sl.d,owner:"",hook:sl.hook||"",concept:sl.note||"",cta:"",hashtags:"",
    url:"",stats:{views:0,likes:0,comments:0,saves:0,shares:0,follows:0},

    milestones:[],links:[],logs:[],quotes:[],desc:"",goal:"",note:""};
  s.items.unshift(o);sl.made=true;save();render();openDetail(o.id);
}
function delSlot(id){

}
function weekBox(){
  const s=ms(),ws=weekStart(todayStr()),w=s.week;
  const fresh=w&&w.start===ws;
  const body=(fresh&&(w.slots||[]).length)?w.slots.map(sl=>`<div class="wslot ${sl.made?"done":""}">
      <div class="wsd">${korDate(sl.d).replace(/^\d+년 /,"")}<span>${esc(sl.tag||"")}</span></div>

  const src=fresh?(w.src==="claude"?"🤖 클로드 자동 생성":"⚙ 자동 생성"):"";
  return `<div class="weekbox">
    <div class="wbh">🗓 이번 주 콘텐츠 스케줄 <span class="wbd">${ws.slice(5)} ~ ${addDays(ws,6).slice(5)}</span>
      <span class="wbsrc">${src}</span>

  const tagOpts=(s.tags||[]).map(t=>`<option ${i.tag===t?"selected":""}>${esc(t)}</option>`).join("");
  const tdDone=i.todos.filter(t=>t.done).length;
  const pct=Math.max(0,Math.min(100,+i.progress||0));
  document.getElementById("dForm").innerHTML=`
    <input class="detail-title" value="${esc(i.title)}" onchange="setF2('title',this.value)">
    <div class="three">
      <div class="field"><label>분류</label><select onchange="setF2('tag',this.value)">${tagOpts}</select></div>
      <div class="field"><label>상태</label><select onchange="setF2('status',this.value)">${statusList().map(t=>`<option ${i.status===t?"selected":""}>${t}</option>`).join("")}</select></div>
      <div class="field"><label>담당 / 협업</label><input value="${esc(i.owner)}" onchange="setF2('owner',this.value)"></div>
    </div>
    <div class="three">
      <div class="field"><label>시작일</label><input type="date" value="${esc(i.start)}" onchange="setF2('start',this.value)"></div>
      <div class="field"><label>마감일 ${i.due?"("+dday(i.due)+")":""}</label><input type="date" value="${esc(i.due)}" onchange="setF2('due',this.value)"></div>
      <div class="field"><label>진행률 ${pct}%</label><input type="number" min="0" max="100" value="${pct}" onchange="setF2('progress',this.value)"></div>
    </div>
    <div class="bar"><i style="width:${pct}%"></i><span>${pct}%</span></div>
    <div class="field"><label>${s.type==="muse"?"🎯 이 콘텐츠의 목표 (예: 저장수 500)":"🎯 목표 (한 줄)"}</label><input value="${esc(i.goal)}" onchange="setF2('goal',this.value)"></div>
    <div class="field"><label>📄 상세 설명</label><textarea onchange="setF2('desc',this.value)">${esc(i.desc)}</textarea></div>
    ${s.type==="muse"?`
    <div class="sect plan">
      <h4>🎬 릴스 기획 <span class="r">첫 1.5초가 전부예요</span></h4>
      <div class="field"><label>🪝 훅 (첫 문장 / 첫 자막)</label>
        <input value="${esc(i.hook||"")}" placeholder="예: 6시 기상 3주차, 솔직히 이게 제일 힘들었어요" onchange="setF2('hook',this.value)"></div>
      <div class="field"><label>🎞 구성 / 컨셉</label>
        <textarea placeholder="컷 순서, 전환, BGM, 톤 등" onchange="setF2('concept',this.value)">${esc(i.concept||"")}</textarea></div>
      <div class="field"><label>📣 CTA (마지막 유도 문구)</label>
        <input value="${esc(i.cta||"")}" placeholder="예: 저장해두고 내일 아침에 따라해보세요" onchange="setF2('cta',this.value)"></div>
      <div class="field"><label># 해시태그</label>
        <textarea class="tags" placeholder="#아침루틴 #직장인브이로그" onchange="setF2('hashtags',this.value)">${esc(i.hashtags||"")}</textarea></div>
    </div>

    <div class="sect perf">
      <h4>📈 성과 기록 <span class="r">업로드 후 숫자를 채워두면 목표에 자동 반영돼요</span></h4>
      <div class="pgrid">
        ${[["views","👀 조회수"],["likes","❤ 좋아요"],["comments","💬 댓글"],["saves","🔖 저장"],["shares","↗ 공유"],["follows","👤 유입 팔로워"]]
          .map(p=>`<div class="field"><label>${p[1]}</label>
            <input type="number" min="0" value="${(i.stats||{})[p[0]]||0}" onchange="setStat('${p[0]}',this.value)"></div>`).join("")}
      </div>
    </div>`:""}

    <div class="sect">
      <h4>${s.type==="muse"?"🎥 촬영·편집 컷 리스트":"☑ 체크리스트"} <span class="r">${tdDone}/${i.todos.length} 완료 · 체크하면 진행률 자동 반영</span></h4>
      ${i.todos.length?i.todos.map(t=>`<div class="row">
        <input type="checkbox" ${t.done?"checked":""} onchange="togTodo('${t.id}')">
        <span class="grow ${t.done?"done":""}">${esc(t.text)}</span>
        <button class="x" onclick="delSub('todos','${t.id}')">✕</button></div>`).join("")
        :`<div class="note">아직 없어요. 아래에 추가해보세요.</div>`}
      <div class="addline"><input id="a_todo" placeholder="할 일 입력 후 Enter" onkeydown="if(event.key==='Enter')addTodo()">
        <button class="btn sm" onclick="addTodo()">추가</button></div>
    </div>

    <div class="sect">
      <h4>🚩 마일스톤 <span class="r">주요 일정</span></h4>
      ${i.milestones.length?i.milestones.map((m,x)=>`<div class="row">
        <input type="checkbox" ${m.done?"checked":""} onchange="togMs(${x})">
        <span class="logdate">${esc(m.date||"")}</span>
        <span class="grow ${m.done?"done":""}">${esc(m.text)}</span>
        <button class="x" onclick="delIdx('milestones',${x})">✕</button></div>`).join("")
        :`<div class="note">아직 없어요.</div>`}
      <div class="addline"><input class="dt" type="date" id="a_ms_d">
        <input id="a_ms_t" placeholder="마일스톤 내용" onkeydown="if(event.key==='Enter')addMs()">
        <button class="btn sm" onclick="addMs()">추가</button></div>
    </div>

    <div class="sect">
      <h4>🔗 자료 링크 <span class="r">피그마·드라이브·노션 등</span></h4>
      ${i.links.length?i.links.map((l,x)=>`<div class="row">
        <span class="grow">${l.url?`<a href="${esc(l.url)}" target="_blank" rel="noreferrer">${esc(l.label||l.url)}</a>`:esc(l.label)}</span>
        <button class="x" onclick="delIdx('links',${x})">✕</button></div>`).join("")
        :`<div class="note">아직 없어요.</div>`}
      <div class="addline"><input class="dt" id="a_lk_l" placeholder="이름">
        <input id="a_lk_u" placeholder="https://..." onkeydown="if(event.key==='Enter')addLink()">
        <button class="btn sm" onclick="addLink()">추가</button></div>
    </div>

    <div class="sect">
      <h4>✍ 문장 수집 <span class="r">${i.quotes.length}개 · 좋았던 문장·짧은 감상</span></h4>
      ${i.quotes.length?i.quotes.map((qq,x)=>`<div class="qrow">
        <span class="qpage">${qq.page?"p."+esc(qq.page):"—"}</span>
        <span class="qtext">${esc(qq.text)}</span>
        <button class="x" onclick="delIdx('quotes',${x})">✕</button></div>`).join("")
        :`<div class="note">마음에 남은 문장을 남겨보세요.</div>`}
      <div class="addline"><input class="pg" id="a_q_p" placeholder="쪽">
        <input id="a_q_t" placeholder="문장이나 짧은 감상 입력 후 Enter" onkeydown="if(event.key==='Enter')addQuote()">
        <button class="btn sm" onclick="addQuote()">담기</button></div>
    </div>

    <div class="sect">
      <h4>${s.type==="muse"?"📝 콘텐츠 회고":"📝 업무 일지"} <span class="r">최신순 ${i.logs.length}건</span></h4>
      ${i.logs.length?i.logs.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(l=>`<div class="row">
        <span class="logdate">${esc(l.date)}</span><span class="grow">${esc(l.text)}</span>
        <button class="x" onclick="delLog(${i.logs.indexOf(l)})">✕</button></div>`).join("")
        :`<div class="note">기록을 남기면 나중에 회고할 때 좋아요.</div>`}
      <div class="addline"><input class="dt" type="date" id="a_lg_d" value="${todayStr()}">
        <input id="a_lg_t" placeholder="오늘 진행한 내용" onkeydown="if(event.key==='Enter')addLog()">
        <button class="btn sm" onclick="addLog()">기록</button></div>
    </div>

    <div class="field"><label>🗒 짧은 메모 (카드에 표시됨)</label><textarea onchange="setF2('note',this.value)">${esc(i.note)}</textarea></div>`;
}
function setF2(k,v){
  const i=find(detailId);if(!i)return;
  i[k]=(k==="progress")?Math.max(0,Math.min(100,+v||0)):v;
  save();renderDetail();
}
function autoProgress(i){
  if(!i.todos.length)return;
  i.progress=Math.round(i.todos.filter(t=>t.done).length/i.todos.length*100);
  if(i.progress===100) i.status="완료"; else if(i.progress>0&&i.status==="할일") i.status="진행중";
}
function addTodo(){
  const el=document.getElementById("a_todo"),v=(el.value||"").trim();if(!v)return;
  const i=find(detailId);i.todos.push({id:uid(),text:v,done:false});autoProgress(i);save();renderDetail();
  const n=document.getElementById("a_todo");if(n)n.focus();
}
function togTodo(tid){
  const i=find(detailId),t=i.todos.find(x=>x.id===tid);if(!t)return;
  t.done=!t.done;autoProgress(i);save();renderDetail();
}
function delSub(key,tid){
  const i=find(detailId);i[key]=i[key].filter(x=>x.id!==tid);
  if(key==="todos")autoProgress(i);save();renderDetail();
}
function delIdx(key,x){const i=find(detailId);i[key].splice(x,1);save();renderDetail();}
function togMs(x){const i=find(detailId);i.milestones[x].done=!i.milestones[x].done;save();renderDetail();}
function addMs(){
  const d=document.getElementById("a_ms_d").value,t=(document.getElementById("a_ms_t").value||"").trim();
  if(!t)return;const i=find(detailId);
  i.milestones.push({date:d,text:t,done:false});
  i.milestones.sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999"));
  save();renderDetail();
}
function addLink(){
  const l=(document.getElementById("a_lk_l").value||"").trim();
  const u=(document.getElementById("a_lk_u").value||"").trim();
  if(!l&&!u)return;const i=find(detailId);
  i.links.push({label:l||u,url:u});save();renderDetail();
}
function addLog(){
  const d=document.getElementById("a_lg_d").value||todayStr();
  const t=(document.getElementById("a_lg_t").value||"").trim();
  if(!t)return;const i=find(detailId);
  i.logs.push({date:d,text:t});save();renderDetail();
}
function setStat(k,v){
  const i=find(detailId);if(!i)return;
  i.stats=i.stats||{};i.stats[k]=Math.max(0,+v||0);
  save();renderDetail();render();
}
function addQuote(){
  const i=find(detailId),t=(document.getElementById("a_q_t").value||"").trim();
  if(!t)return;
  i.quotes.push({id:uid(),page:(document.getElementById("a_q_p").value||"").trim(),text:t});
  save();renderDetail();
}
function delLog(x){const i=find(detailId);if(x>-1)i.logs.splice(x,1);save();renderDetail();}

/* ---- 백업 ---- */
function exportJSON(){
  const blob=new Blob([JSON.stringify(DATA,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="work_os_backup_"+todayStr()+".json";a.click();URL.revokeObjectURL(a.href);
}
function importJSON(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{DATA=normalize(JSON.parse(r.result));cur=tabKeys()[0];render();alert("복원 완료 ✓");}
    catch(err){alert("파일을 읽을 수 없어요.");}};
  r.readAsText(f);e.target.value="";
}
function resetAll(){
  if(!confirm("모든 내용을 샘플 데이터로 되돌립니다. 계속할까요?"))return;
  DATA=normalize(JSON.parse(JSON.stringify(SEED)));cur="project";render();
}

document.getElementById("overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeEdit();});
document.getElementById("detail").addEventListener("click",e=>{if(e.target.id==="detail")closeDetail();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeEdit();if(detailId)closeDetail();}});
setInterval(()=>{
  const d=new Date();
  document.getElementById("clock").textContent=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
},1000);
renderLogo();
render();
</script>
